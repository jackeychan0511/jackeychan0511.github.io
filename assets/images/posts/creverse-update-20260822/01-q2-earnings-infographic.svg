<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="640" viewBox="0 0 1200 640" font-family="Apple SD Gothic Neo, NanumGothic, Noto Sans KR, Malgun Gothic, sans-serif">
<rect width="1200" height="640" fill="#ffffff"/>
<text x="60" y="58" font-size="40" font-weight="bold" fill="#111827">크레버스(CREVERSE) 2026년 2분기 실적 스냅샷</text>
<text x="60" y="94" font-size="22" fill="#6b7280">2026년 2분기 연결 기준 · 8/14 잠정실적 발표 (조선비즈·더벨 보도)</text>
<line x1="60" y1="118" x2="1140" y2="118" stroke="#e5e7eb" stroke-width="2"/>

<g>
<rect x="60" y="150" width="340" height="200" rx="16" fill="#f3f4f6"/>
<text x="90" y="200" font-size="22" fill="#6b7280">2분기 매출</text>
<text x="90" y="280" font-size="52" font-weight="bold" fill="#111827">555<text font-size="30" fill="#6b7280">억원</text></text>
<text x="90" y="322" font-size="20" fill="#9ca3af">연결 기준 영업수익</text>
</g>

<g>
<rect x="430" y="150" width="340" height="200" rx="16" fill="#f3f4f6"/>
<text x="460" y="200" font-size="22" fill="#6b7280">2분기 영업이익</text>
<text x="460" y="280" font-size="52" font-weight="bold" fill="#111827">24<text font-size="30" fill="#6b7280">억원</text><text font-size="30" fill="#dc2626"> (+53.9%)</text></text>
<text x="460" y="322" font-size="20" fill="#9ca3af">전년 동기 대비 8억원 증가</text>
</g>

<g>
<rect x="800" y="150" width="340" height="200" rx="16" fill="#f3f4f6"/>
<text x="830" y="200" font-size="22" fill="#6b7280">상반기 누적 영업이익</text>
<text x="830" y="280" font-size="52" font-weight="bold" fill="#111827">50<text font-size="30" fill="#6b7280">억원</text></text>
<text x="830" y="322" font-size="20" fill="#9ca3af">1~6월 누적</text>
</g>

<g>
<rect x="60" y="380" width="340" height="200" rx="16" fill="#f3f4f6"/>
<text x="90" y="430" font-size="22" fill="#6b7280">CMS영재관 2분기 매출</text>
<text x="90" y="510" font-size="52" font-weight="bold" fill="#111827">149<text font-size="30" fill="#6b7280">억원</text><text font-size="30" fill="#dc2626"> (+14.7%)</text></text>
<text x="90" y="552" font-size="20" fill="#9ca3af">재원생 +892명(+12.4%) · 4년 연속 확대</text>
</g>

<g>
<rect x="430" y="380" width="340" height="200" rx="16" fill="#f3f4f6"/>
<text x="460" y="430" font-size="22" fill="#6b7280">중간배당</text>
<text x="460" y="510" font-size="52" font-weight="bold" fill="#111827">500<text font-size="30" fill="#6b7280">원/주</text></text>
<text x="460" y="552" font-size="20" fill="#9ca3af">총 42억원 규모 · 7월 조기 확정 집행</text>
</g>

<g>
<rect x="800" y="380" width="340" height="200" rx="16" fill="#f3f4f6"/>
<text x="830" y="430" font-size="22" fill="#6b7280">자사주 소각 (상반기)</text>
<text x="830" y="510" font-size="52" font-weight="bold" fill="#111827">90<text font-size="30" fill="#6b7280">만주</text></text>
<text x="830" y="552" font-size="20" fill="#9ca3af">배당과 병행한 주주환원 정책</text>
</g>
</svg>
