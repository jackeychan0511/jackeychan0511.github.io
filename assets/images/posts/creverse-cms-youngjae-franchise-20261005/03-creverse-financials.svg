    <text x="775" y="390" fill="#cbd5e1">2025</text>
    <rect x="880" y="372" width="18" height="22" rx="6" fill="#eab308"/>
    <text x="912" y="390" fill="#fef08a" font-size="20" font-weight="700">22</text>

