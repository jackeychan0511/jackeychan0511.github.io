  <text x="70" y="692" font-family="'Apple SD Gothic Neo','Malgun Gothic','Noto Sans KR',sans-serif" font-size="18" fill="#8a99a8">※ 거래 관련 증감액만 단순 가감한 수치로, 외부감사 결과에 따라 실제와 차이가 있을 수 있음</text>
