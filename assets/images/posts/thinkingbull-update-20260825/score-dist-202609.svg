<svg xmlns="http://www.w3.org/2000/svg" width="900" height="580" viewBox="0 0 900 580" font-family="'Apple SD Gothic Neo','Malgun Gothic','Noto Sans KR',sans-serif">
  <rect width="900" height="580" fill="#ffffff"/>
  <!-- Title -->
  <text x="450" y="52" text-anchor="middle" font-size="27" font-weight="700" fill="#1a1a2e">생각하는황소 9월 고등과정 진급시험 성적분포</text>
  <text x="450" y="84" text-anchor="middle" font-size="16" fill="#666">대치·분당 재원생 142명 · 공식 블로그 2026. 8. 17 공개</text>

  <!-- Stat cards -->
  <rect x="60"  y="110" width="240" height="96" rx="12" fill="#f4f6fb" stroke="#d9deeb"/>
  <rect x="330" y="110" width="240" height="96" rx="12" fill="#f4f6fb" stroke="#d9deeb"/>
  <rect x="600" y="110" width="240" height="96" rx="12" fill="#f4f6fb" stroke="#d9deeb"/>
  <text x="180" y="148" text-anchor="middle" font-size="30" font-weight="800" fill="#1a1a2e">142명</text>
  <text x="180" y="178" text-anchor="middle" font-size="14" fill="#888">응시 인원</text>
  <text x="450" y="148" text-anchor="middle" font-size="30" font-weight="800" fill="#1a1a2e">50.12점</text>
  <text x="450" y="178" text-anchor="middle" font-size="14" fill="#888">평균 점수</text>
  <text x="720" y="148" text-anchor="middle" font-size="30" font-weight="800" fill="#1a1a2e">90점</text>
  <text x="720" y="178" text-anchor="middle" font-size="14" fill="#888">최고 점수 (실력정석)</text>

  <!-- Band chart -->
  <text x="450" y="268" text-anchor="middle" font-size="18" font-weight="700" fill="#1a1a2e">점수 구간별 배정 과정</text>
  <line x1="70" y1="300" x2="870" y2="300" stroke="#ccc" stroke-width="2"/>
  <!-- scale marks -->
  <g font-size="13" fill="#999" text-anchor="middle">
    <line x1="70"  y1="295" x2="70"  y2="305" stroke="#ccc"/>
    <line x1="230" y1="295" x2="230" y2="305" stroke="#ccc"/>
    <line x1="390" y1="295" x2="390" y2="305" stroke="#ccc"/>
    <line x1="550" y1="295" x2="550" y2="305" stroke="#ccc"/>
    <line x1="710" y1="295" x2="710" y2="305" stroke="#ccc"/>
    <line x1="870" y1="295" x2="870" y2="305" stroke="#ccc"/>
    <text x="70"  y="325">0</text>
    <text x="230" y="325">20</text>
    <text x="390" y="325">40</text>
    <text x="550" y="325">60</text>
    <text x="710" y="325">80</text>
    <text x="870" y="325">100</text>
  </g>
  <!-- bands: score->x : x = 70 + score*8 -->
  <rect x="630" y="335" width="160" height="44" rx="8" fill="#e5484d"/>
  <rect x="470" y="335" width="140" height="44" rx="8" fill="#f5a524"/>
  <rect x="310" y="335" width="140" height="44" rx="8" fill="#3e63dd"/>
  <rect x="70"  y="335" width="220" height="44" rx="8" fill="#d7dce8"/>

  <text x="710" y="362" text-anchor="middle" font-size="15" font-weight="700" fill="#fff">실력정석</text>
  <text x="540" y="362" text-anchor="middle" font-size="14" font-weight="700" fill="#fff">기본정석 PLUS</text>
  <text x="380" y="362" text-anchor="middle" font-size="14" font-weight="700" fill="#fff">기본정석 LIGHT</text>
  <text x="180" y="362" text-anchor="middle" font-size="13" font-weight="600" fill="#556">30점 미만</text>

  <!-- range labels -->
  <text x="710" y="405" text-anchor="middle" font-size="14" fill="#1a1a2e" font-weight="700">70~90점</text>
  <text x="540" y="405" text-anchor="middle" font-size="13" fill="#555">50~67.5점</text>
  <text x="380" y="405" text-anchor="middle" font-size="13" fill="#555">30~47.5점</text>
  <text x="180" y="405" text-anchor="middle" font-size="12" fill="#999">하위 구간</text>
  <text x="710" y="428" text-anchor="middle" font-size="12" fill="#888">상위 약 21%</text>

  <!-- comparison -->
  <rect x="120" y="455" width="660" height="86" rx="12" fill="#faf7ef" stroke="#eadfc3"/>
  <text x="450" y="484" text-anchor="middle" font-size="15" font-weight="700" fill="#8a6d1d">전회(2026년 6월 진급시험)와 비교</text>
  <text x="450" y="512" text-anchor="middle" font-size="14" fill="#444">응시 인원 179명 → 142명 (−20.7%) · 평균 50.92점 → 50.12점 · 최고 85점 → 90점</text>
  <text x="450" y="534" text-anchor="middle" font-size="12" fill="#999">출처: 생각하는황소 대치본원 공식 네이버 블로그 (시험결과 카테고리)</text>
</svg>
