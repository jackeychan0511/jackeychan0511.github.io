<svg xmlns="http://www.w3.org/2000/svg" width="800" height="420" viewBox="0 0 800 420" font-family="'Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f4f7fb"/>
    </linearGradient>
  </defs>
  <rect width="800" height="420" fill="url(#bg)"/>
  <text x="400" y="42" text-anchor="middle" font-size="24" font-weight="700" fill="#1a2b4a">김영화 회장 크레버스 지분율 추이 (2026년)</text>
  <text x="400" y="66" text-anchor="middle" font-size="14" fill="#66748c">5월 장내매수 → 7월 추가 매수 → 8월 첫째 주 추가 매수… 17.11%</text>

  <!-- chart area -->
  <g transform="translate(80, 110)">
    <!-- y grid -->
    <line x1="0" y1="0" x2="640" y2="0" stroke="#e3e8f0" stroke-width="1"/>
    <line x1="0" y1="70" x2="640" y2="70" stroke="#e3e8f0" stroke-width="1"/>
    <line x1="0" y1="140" x2="640" y2="140" stroke="#e3e8f0" stroke-width="1"/>
    <line x1="0" y1="210" x2="640" y2="210" stroke="#e3e8f0" stroke-width="1"/>
    <line x1="0" y1="280" x2="640" y2="280" stroke="#e3e8f0" stroke-width="1"/>
    <!-- y labels: 16.0 ~ 17.5 -->
    <text x="-14" y="6" text-anchor="end" font-size="13" fill="#66748c">17.5%</text>
    <text x="-14" y="76" text-anchor="end" font-size="13" fill="#66748c">17.0%</text>
    <text x="-14" y="146" text-anchor="end" font-size="13" fill="#66748c">16.5%</text>
    <text x="-14" y="216" text-anchor="end" font-size="13" fill="#66748c">16.0%</text>
    <text x="-14" y="286" text-anchor="end" font-size="13" fill="#66748c">15.5%</text>

    <!-- data: 16.05% -> y=238 ; 17.07% -> y=84 ; 17.11% -> y=78 -->
    <!-- polyline -->
    <polyline points="80,238 330,84 590,78" fill="none" stroke="#2f6fed" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
    <!-- dots -->
    <circle cx="80" cy="238" r="8" fill="#2f6fed"/>
    <circle cx="330" cy="84" r="8" fill="#2f6fed"/>
    <circle cx="590" cy="78" r="10" fill="#e8563d" stroke="#ffffff" stroke-width="3"/>

    <!-- labels -->
    <text x="80" y="258" text-anchor="middle" font-size="14" font-weight="700" fill="#1a2b4a">5/15</text>
    <text x="80" y="276" text-anchor="middle" font-size="13" fill="#2f6fed">16.05%</text>
    <text x="80" y="294" text-anchor="middle" font-size="11" fill="#8a97ad">+9,663주</text>

    <text x="330" y="64" text-anchor="middle" font-size="14" font-weight="700" fill="#1a2b4a">7/23</text>
    <text x="330" y="46" text-anchor="middle" font-size="13" fill="#2f6fed">17.07%</text>
    <text x="330" y="28" text-anchor="middle" font-size="11" fill="#8a97ad">+10,530주</text>

    <text x="590" y="58" text-anchor="middle" font-size="15" font-weight="700" fill="#e8563d">8/6</text>
    <text x="590" y="38" text-anchor="middle" font-size="14" font-weight="700" fill="#e8563d">17.11%</text>
    <text x="590" y="20" text-anchor="middle" font-size="11" fill="#8a97ad">+4,732주 (7/31·8/6)</text>

    <!-- x axis -->
    <line x1="0" y1="280" x2="640" y2="280" stroke="#c6cfdd" stroke-width="2"/>
  </g>

  <!-- footer note -->
  <text x="400" y="392" text-anchor="middle" font-size="12.5" fill="#8a97ad">8/7 공시 기준 · 주가 8,500원(8/7 종가, +1.55%) · 중간배당 주당 500원 결정(7/8 공시)</text>
</svg>
