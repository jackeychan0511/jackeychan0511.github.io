<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="660" viewBox="0 0 1200 660" font-family="Apple SD Gothic Neo, NanumGothic, Noto Sans KR, Malgun Gothic, sans-serif">
<rect width="1200" height="660" fill="#ffffff"/>
<text x="60" y="56" font-size="37" font-weight="bold" fill="#111827">김영화 회장, 사흘간 13,127주 장내매수 — 지분율 17.28%</text>
<text x="60" y="92" font-size="22" fill="#6b7280">2026년 9월 4일 · 임원·주요주주 소유상황보고서 (9/3 공시, 기준일 9/3)</text>
<line x1="60" y1="116" x2="1140" y2="116" stroke="#e5e7eb" stroke-width="2"/>

<!-- Card 1: 매수 내역 -->
<rect x="60" y="140" width="640" height="232" rx="14" fill="#eef2ff" stroke="#c7d2fe" stroke-width="1.5"/>
<text x="84" y="178" font-size="21" font-weight="bold" fill="#4338ca">① 세 차례 장내매수 — 총 13,127주 (약 1.13억원)</text>
<text x="84" y="214" font-size="18" fill="#374151">8/27  +5,027주  @ 8,577원</text>
<text x="84" y="246" font-size="18" fill="#374151">8/31  +5,000주  @ 8,555원</text>
<text x="84" y="278" font-size="18" fill="#374151">9/3   +3,100주  @ 8,643원</text>
<text x="84" y="318" font-size="16" fill="#6b7280">매수대금 약 1.13억원 · 계약결제일 기준 · 전부 보통주 장내매수</text>
<text x="84" y="346" font-size="16" fill="#6b7280">직전 보고서(8/21) 대비 +13,127주, +0.13%p</text>

<!-- Card 2: 지분율 추이 -->
<rect x="740" y="140" width="400" height="232" rx="14" fill="#ecfdf5" stroke="#a7f3d0" stroke-width="1.5"/>
<text x="764" y="178" font-size="21" font-weight="bold" fill="#047857">② 김영화 본인 지분율 추이</text>
<text x="764" y="216" font-size="18" fill="#374151">7/22 기준  17.07%</text>
<text x="764" y="248" font-size="18" fill="#374151">8/6 기준   17.11%</text>
<text x="764" y="280" font-size="18" fill="#374151">8/21 기준  17.15%</text>
<text x="764" y="318" font-size="21" font-weight="bold" fill="#047857">9/3 기준   17.28% (+0.13%p)</text>
<text x="764" y="346" font-size="16" fill="#6b7280">보유 1,768,902주 · 발행주식 총수 10,238,180주</text>

<!-- Card 3: 최대주주 측 -->
<rect x="60" y="400" width="1080" height="92" rx="14" fill="#fffbeb" stroke="#fde68a" stroke-width="1.5"/>
<text x="84" y="438" font-size="20" font-weight="bold" fill="#92400e">최대주주 측(김영화 + 특별관계자) 보유 27.34% — 대량보유보고서(9/3) 기준, +0.18%p</text>
<text x="84" y="470" font-size="17" fill="#78350f">보유 주식등 2,807,734주 (직전 2,789,257주 · 27.16%) · 가을학기 개강(8/31) 직후 이어진 오너 매수</text>

<!-- Card 4: 담보 연장 -->
<rect x="60" y="520" width="1080" height="92" rx="14" fill="#fef2f2" stroke="#fecaca" stroke-width="1.5"/>
<text x="84" y="558" font-size="20" font-weight="bold" fill="#991b1b">주식담보계약 연장 공시(기재정정, 9/3) — 한국투자증권 38억·102,725주, 9/3~12/3로 3개월 연장</text>
<text x="84" y="590" font-size="17" fill="#7f1d1d">누적 담보 3건(한국투자증권·NH농협은행·한국증권금융) 1,273,725주 · 담보설정 98.4억 · 전부 실행 시 지분 4.84%p 감소(조건부)</text>
</svg>
