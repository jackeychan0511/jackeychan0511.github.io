<header class="site-header">
  <div class="container">
    <div class="header-inner">
      <div class="site-brand">
        <a href="{{ '/' | relative_url }}" class="site-logo">
          <img src="{{ '/assets/images/logo-wide.png' | relative_url }}" alt="{{ site.title }}" class="logo-img">
          <span class="logo-text">AZ재찬키의 G편한세상</span>
        </a>
      </div>
      <nav class="site-nav">
        <button class="nav-toggle" aria-label="메뉴 열기">
          <span></span><span></span><span></span>
        </button>
        <ul class="nav-list">
          {% for cat in site.category_order %}
          <li>
            <a href="{{ '/category/' | append: cat | relative_url }}"
               class="nav-link {% if page.category == cat %}active{% endif %}">
              {{ site.category_names[cat] }}
            </a>
          </li>
          {% endfor %}
          <li><a href="{{ '/video-dashboard/' | relative_url }}" class="nav-link {% if page.url == '/video-dashboard/' %}active{% endif %}">📺 무료강의</a></li>
          <li><a href="{{ '/about' | relative_url }}" class="nav-link">소개</a></li>
        </ul>
      </nav>
    </div>
  </div>
</header>
