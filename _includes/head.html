<meta charset="utf-8">
<meta http-equiv="X-UA-Compatible" content="IE=edge">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="naver-site-verification" content="87a6cd8096bbd3c7a2ced02960db8efff0bfcfe2" />

{% if page.noindex %}
<meta name="robots" content="noindex, nofollow">
{% endif %}

{% seo %}

<link rel="stylesheet" href="{{ '/assets/css/style.css' | relative_url }}">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;500;700;900&family=Nanum+Gothic:wght@400;700;800&display=swap" rel="stylesheet">
<link rel="alternate" type="application/rss+xml" title="{{ site.title }}" href="{{ '/feed.xml' | relative_url }}">

{% if site.google_analytics and jekyll.environment == 'production' %}
<!-- Google Analytics -->
<script async src="https://www.googletagmanager.com/gtag/js?id={{ site.google_analytics }}"></script>
<script>
  window.dataLayer = window.dataLayer || [];
  function gtag(){dataLayer.push(arguments);}
  gtag('js', new Date());
  gtag('config', '{{ site.google_analytics }}');
</script>
{% endif %}

{% if site.naver_analytics %}
<!-- Naver Analytics -->
<script type="text/javascript" src="//wcs.pstatic.net/wcslog.js"></script>
<script type="text/javascript">
if(!wcs_add) var wcs_add = {};
wcs_add["wa"] = "{{ site.naver_analytics }}";
if(window.wcs) {
  wcs_do();
}
</script>
{% endif %}

{% if site.adsense.enabled and site.adsense.publisher_id != "" %}
<!-- Google AdSense -->
<script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client={{ site.adsense.publisher_id }}"
  crossorigin="anonymous"></script>
{% endif %}

<link rel="icon" href="{{ '/assets/images/logo-symbol.png' | relative_url }}">
<link rel="apple-touch-icon" href="{{ '/assets/images/logo-symbol.png' | relative_url }}">
<meta property="og:image" content="{{ '/assets/images/logo-symbol.png' | relative_url }}">
