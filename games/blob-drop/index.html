<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#1b1535">
<title>Blob Drop — 몽글몽글 합체 퍼즐</title>
<meta name="description" content="같은 몽글이를 떨어뜨려 합치고 진화시키는 물리 머지 퍼즐. 데일리 챌린지와 도감 수집.">
<style>
:root{--bg:#1b1535;--panel:#2a2250;--ink:#fff;--sub:#b9b0e6;--acc:#ffd166;--acc2:#ff7eb6}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none}
html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);font-family:-apple-system,"Apple SD Gothic Neo","Noto Sans KR",sans-serif;overflow:hidden;touch-action:none}
#app{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;padding:env(safe-area-inset-top) 8px env(safe-area-inset-bottom)}
#hud{width:100%;max-width:440px;display:flex;align-items:center;justify-content:space-between;padding:8px 4px;gap:8px}
.stat{background:var(--panel);border-radius:12px;padding:4px 12px;min-width:76px;text-align:center}
.stat small{display:block;font-size:10px;color:var(--sub)}
.stat b{font-size:18px}
#next{display:flex;align-items:center;gap:6px}
#next canvas{width:44px;height:44px;background:var(--panel);border-radius:50%}
#stage{position:relative;flex:1;width:100%;max-width:440px;min-height:0}
#c{position:absolute;left:50%;top:0;transform:translateX(-50%);border-radius:14px;background:linear-gradient(#2d2560,#211a47)}
#combo{position:absolute;left:0;right:0;top:12%;text-align:center;font-size:34px;font-weight:900;color:var(--acc);text-shadow:0 3px 0 #0006;pointer-events:none;opacity:0;transition:opacity .2s,transform .2s}
#combo.show{opacity:1;transform:scale(1.15)}
#bar{width:100%;max-width:440px;display:flex;gap:6px;padding:8px 0}
button{font:inherit;color:var(--ink);background:var(--panel);border:0;border-radius:12px;padding:10px 6px;flex:1;font-weight:700;font-size:13px;cursor:pointer}
button:active{transform:scale(.96)}
button.hot{background:var(--acc2)}
button small{display:block;font-weight:400;font-size:10px;color:var(--sub)}
.ov{position:fixed;inset:0;background:#000b;display:none;align-items:center;justify-content:center;z-index:5;padding:16px}
.ov.on{display:flex}
.card{background:var(--panel);border-radius:20px;padding:20px;width:100%;max-width:400px;max-height:90vh;overflow:auto;text-align:center}
.card h2{margin:0 0 4px}.card p{color:var(--sub);font-size:13px;margin:6px 0 12px}
.card .row{display:flex;gap:8px;margin-top:8px}
.card button.big{padding:14px;font-size:16px;background:var(--acc);color:#2a1a00}
#dex{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin:10px 0}
#dex div{font-size:11px;color:var(--sub)}#dex canvas{width:100%;aspect-ratio:1}
#dex .lock canvas{filter:brightness(0) opacity(.35)}
.tag{display:inline-block;background:#0004;border-radius:99px;padding:2px 10px;font-size:11px;color:var(--acc)}
</style>
</head>
<body>
<div id="app">
  <div id="hud">
    <div class="stat"><small>SCORE</small><b id="score">0</b></div>
    <div id="next"><span style="font-size:11px;color:var(--sub)">NEXT</span><canvas id="nc" width="88" height="88"></canvas></div>
    <div class="stat"><small id="bestl">BEST</small><b id="best">0</b></div>
  </div>
  <div id="stage"><canvas id="c"></canvas><div id="combo"></div></div>
  <div id="bar">
    <button id="bShake">🌀 흔들기<small id="nShake"></small></button>
    <button id="bBomb">💥 폭파<small id="nBomb"></small></button>
    <button id="bDex">📖 도감</button>
    <button id="bMenu">⚙️ 메뉴</button>
  </div>
</div>

<div class="ov on" id="ovStart"><div class="card">
  <h2>🫧 Blob Drop</h2>
  <p>별똥이 부서진 밤, 작은 몽글이들이 태어났어요.<br>같은 몽글이끼리 합쳐 커지면, 언젠가 <b>별의 정령</b>이 되어 하늘로 돌아갈 수 있대요.<br><small>드래그로 위치를 잡고, 손을 떼면 떨어집니다.</small></p>
  <div class="row"><button class="big" id="goNormal">일반 모드</button></div>
  <div class="row"><button class="big" id="goDaily" style="background:var(--acc2);color:#fff">🌠 오늘의 별똥<small id="dailyInfo"></small></button></div>
  <div class="row"><button id="goDex">📖 도감</button><button id="goTheme">🎨 테마</button></div>
</div></div>

<div class="ov" id="ovOver"><div class="card">
  <h2>상자가 넘쳤어요!</h2>
  <p id="overInfo"></p>
  <div class="row"><button class="big" id="bRevive">📺 광고 보고 한 칸 비우기<small>(이어하기 1회)</small></button></div>
  <div class="row"><button id="bShare">📋 결과 공유</button><button id="bRetry">다시 하기</button></div>
  <div class="row"><button id="bHome">처음으로</button></div>
</div></div>

<div class="ov" id="ovDex"><div class="card">
  <h2>📖 몽글이 도감</h2><p id="dexInfo"></p><div id="dex"></div>
  <button id="dexClose">닫기</button>
</div></div>

<div class="ov" id="ovTheme"><div class="card">
  <h2>🎨 시즌 테마</h2><p>테마는 색·이름·소리만 교체되는 구조입니다. 새 테마는 코드에 한 블록만 추가하면 됩니다.</p>
  <div id="themeList"></div>
  <button id="themeClose" style="margin-top:10px">닫기</button>
</div></div>

<div class="ov" id="ovMenu"><div class="card">
  <h2>메뉴</h2>
  <div class="row"><button id="mSound"></button><button id="mVib"></button></div>
  <div class="row"><button id="mNoAds">🚫 광고 제거 (1회 결제)<small id="noAdsState"></small></button></div>
  <div class="row"><button id="mRestart">다시 시작</button><button id="mClose">닫기</button></div>
</div></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/matter-js/0.20.0/matter.min.js"></script>
<script>
(function(){
'use strict';
const {Engine,World,Bodies,Body,Events,Composite}=Matter;

/* ───────── 시즌 테마 (교체 가능 구조) ─────────
   levels: [이름, 색(밝은), 색(어두운), 배지 이모지]. 11단계. */
const THEMES={
  jelly:{name:'별똥 밤하늘',scene:'night',bg:['#2d2560','#171238'],levels:[
    ['반짝콩','#ff9aa2','#e0707c','·','별똥이 부서져 생긴 가장 작은 조각. 아직 말이 서툴러요.'],
    ['별방울','#ffb86b','#e28a3a','💧','밤이슬을 머금고 톡 터질 듯 말랑해졌어요.'],
    ['달빛몽','#ffe066','#d9b72a','☁️','달빛을 쬐며 낮잠 자는 걸 제일 좋아해요.'],
    ['클로버몽','#b8e986','#82bd4f','🍀','별똥이 떨어진 풀밭에서 행운을 주워 왔어요.'],
    ['물결몽','#6fe3c1','#38b393','🌊','밤바다의 물결을 따라 흘러온 수다쟁이.'],
    ['샛별몽','#6cc3ff','#3590d6','⭐','하늘에서 가장 먼저 반짝이는 별을 닮았어요.'],
    ['초승몽','#8d8cff','#5c5bd6','🌙','초승달 모자를 쓰고 하늘길을 안내해요.'],
    ['신비몽','#c38bff','#9556d6','🔮','별자리의 비밀을 알고 있다고 소문났어요.'],
    ['오로라몽','#ff8bd8','#d654aa','✨','몸에서 오로라가 흘러나오는 하늘 직전의 몽글이.'],
    ['왕별몽','#ff6b6b','#c93c3c','👑','모든 몽글이의 존경을 받는 별의 임금님.'],
    ['별의 정령','#fff1a8','#f5b700','🌈','모두가 하나로 합쳐져 마침내 하늘로 돌아가는 전설의 몽글이.']]},
  space:{name:'우주 정거장',scene:'space',bg:['#101a3d','#0a1129'],levels:[
    ['먼지','#9aa5c4','#6c7899','·'],['운석','#b08968','#7f5d41','☄️'],['달조각','#e5e5e5','#a9a9a9','🌑'],
    ['위성','#7ec8e3','#4a9cba','🛰️'],['화성','#ff7b54','#c9512c','🔴'],['목성','#f2b66d','#c68a3c','🟠'],
    ['토성','#f6e27f','#c8b24e','🪐'],['푸른별','#4f9dff','#2a6ed1','🌍'],['항성','#ffd23f','#e09b00','☀️'],
    ['성운','#d36bff','#9a3bd1','🌌'],['은하','#ffffff','#a0b4ff','🌀']]},
  food:{name:'몽글 식당',scene:'food',bg:['#4a2a2a','#321c1c'],levels:[
    ['깨알','#d9c7a3','#a8946b','·'],['콩','#a3c76e','#74994a','🫘'],['방울토마토','#ff6b5a','#c93f31','🍅'],
    ['당근','#ff9f43','#d0741b','🥕'],['달걀','#fff2cc','#d9c27a','🥚'],['만두','#f3e1c4','#c9a96e','🥟'],
    ['김밥','#5b7f4a','#3c5a2f','🍙'],['피자','#ffc857','#d99a1f','🍕'],['케이크','#ffadd2','#d96fa3','🍰'],
    ['잔치상','#e85d75','#b73a50','🍱'],['황금식탁','#ffe27a','#e0a800','🏆']]}
};
const N=11;
const RAD=[15,21,28,36,45,55,66,78,91,105,120];
const SCORE=[1,3,6,10,15,21,28,36,45,55,66];
const W=360,H=560,LINE=96,WALL=60;

/* ───────── 저장소 ───────── */
const store={
  get(k,d){try{const v=localStorage.getItem('bd_'+k);return v==null?d:JSON.parse(v)}catch(e){return d}},
  set(k,v){try{localStorage.setItem('bd_'+k,JSON.stringify(v))}catch(e){}}
};
const S={theme:store.get('theme','jelly'),sound:store.get('sound',true),vib:store.get('vib',true),
  noAds:store.get('noAds',false),best:store.get('best',0),dex:store.get('dex',{}),
  items:store.get('items',{shake:1,bomb:1})};

/* ───────── 광고/결제 어댑터 (실서비스에서는 AdMob·IAP SDK로 교체) ───────── */
const Monet={
  rewarded(cb){ if(S.noAds){cb(true);return}
    if(window.BlobDropAds&&window.BlobDropAds.rewarded) return window.BlobDropAds.rewarded(cb);
    cb(confirm('[데모] 보상형 광고를 시청한 것으로 처리할까요?'))},
  buyNoAds(){ if(window.BlobDropAds&&window.BlobDropAds.buyNoAds) return window.BlobDropAds.buyNoAds(()=>{S.noAds=true;store.set('noAds',true);refreshUI()});
    if(confirm('[데모] 광고 제거를 구매한 것으로 처리할까요?')){S.noAds=true;store.set('noAds',true);refreshUI()}}
};

/* ───────── 시드 난수 (데일리 챌린지) ───────── */
function mulberry(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
function todayKey(){const d=new Date(Date.now()+9*3600e3);return d.toISOString().slice(0,10)}
function dateSeed(k){return +k.replace(/-/g,'')}

/* ───────── 오디오·진동 ───────── */
let AC=null;
function tone(f,d,type,vol,when){ if(!S.sound)return;
  try{AC=AC||new (window.AudioContext||window.webkitAudioContext)();
    const t=AC.currentTime+(when||0),o=AC.createOscillator(),g=AC.createGain();
    o.type=type||'sine';o.frequency.setValueAtTime(f,t);o.frequency.exponentialRampToValueAtTime(f*1.5,t+d*.6);
    g.gain.setValueAtTime(vol||.15,t);g.gain.exponentialRampToValueAtTime(.001,t+d);
    o.connect(g);g.connect(AC.destination);o.start(t);o.stop(t+d)}catch(e){}}
function sfxMerge(l,combo){const base=261.6*Math.pow(2,(l*2+Math.min(combo,6))/12);tone(base,.25,'triangle',.18);tone(base*1.5,.2,'sine',.08,.05)}
function sfxDrop(){tone(180,.12,'sine',.12)}
function vib(p){if(S.vib&&navigator.vibrate)try{navigator.vibrate(p)}catch(e){}}

/* ───────── 몽글이 그리기 ───────── */
function drawBlob(ctx,x,y,r,l,o){
  o=o||{};const th=THEMES[S.theme].levels[l];
  const sq=o.sq||0;
  ctx.save();ctx.translate(x,y);ctx.rotate(o.a||0);ctx.scale(1+sq*.06,1-sq*.06);
  const g=ctx.createRadialGradient(-r*.35,-r*.4,r*.1,0,0,r);
  g.addColorStop(0,th[1]);g.addColorStop(1,th[2]);
  ctx.fillStyle=g;ctx.beginPath();ctx.arc(0,0,r,0,7);ctx.fill();
  ctx.strokeStyle='#0003';ctx.lineWidth=Math.max(1.5,r*.05);ctx.stroke();
  // 하이라이트
  ctx.fillStyle='#fff6';ctx.beginPath();ctx.ellipse(-r*.4,-r*.5,r*.22,r*.12,-.6,0,7);ctx.fill();
  // 눈
  const ex=r*.32,ey=-r*.05,er=Math.max(2,r*.13);
  ctx.fillStyle='#2b1d3a';
  const happy=o.happy;
  if(happy){ctx.lineWidth=Math.max(1.5,r*.07);ctx.strokeStyle='#2b1d3a';ctx.lineCap='round';
    [-1,1].forEach(s=>{ctx.beginPath();ctx.arc(s*ex,ey+er*.4,er,Math.PI*1.1,Math.PI*1.9);ctx.stroke()})}
  else [-1,1].forEach(s=>{ctx.beginPath();ctx.arc(s*ex,ey,er,0,7);ctx.fill();
    ctx.fillStyle='#fff';ctx.beginPath();ctx.arc(s*ex+er*.3,ey-er*.3,er*.35,0,7);ctx.fill();ctx.fillStyle='#2b1d3a'});
  // 볼터치·입
  ctx.fillStyle='#ff6b9d55';[-1,1].forEach(s=>{ctx.beginPath();ctx.ellipse(s*r*.55,r*.2,r*.12,r*.08,0,0,7);ctx.fill()});
  ctx.strokeStyle='#2b1d3a';ctx.lineWidth=Math.max(1.5,r*.06);ctx.lineCap='round';
  ctx.beginPath();ctx.arc(0,r*.18,r*.14,.15*Math.PI,.85*Math.PI);ctx.stroke();
  // 배지
  if(th[3]!=='·'&&r>=26){ctx.font=Math.round(r*.4)+'px serif';ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillText(th[3],0,-r*.68)}
  ctx.restore();
}


/* ───────── 배경 장면 (이미지 파일 없이 코드로 그림 · 테마별 교체) ───────── */
const STARS=Array.from({length:60},(_,i)=>({x:(i*97%360),y:(i*53%420),r:.6+(i%4)*.4,p:i*.7}));
const SCENES={
  night(c,now,th){
    const g=c.createLinearGradient(0,0,0,H);g.addColorStop(0,'#2a2466');g.addColorStop(.6,th.bg[1]);g.addColorStop(1,'#0e0b26');c.fillStyle=g;c.fillRect(0,0,W,H);
    c.fillStyle='#fff';STARS.forEach(s=>{c.globalAlpha=.4+.6*Math.abs(Math.sin(now/900+s.p));c.beginPath();c.arc(s.x,s.y,s.r,0,7);c.fill()});c.globalAlpha=1;
    c.fillStyle='#ffe9a8';c.beginPath();c.arc(300,60,22,0,7);c.fill();c.fillStyle='#2a2466';c.beginPath();c.arc(309,54,20,0,7);c.fill();
    const t=(now/5000)%1;if(t<.3){const k=t/.3;c.strokeStyle='#fff';c.globalAlpha=1-k;c.lineWidth=2;c.beginPath();c.moveTo(40+k*260,30+k*120);c.lineTo(10+k*260,10+k*120);c.stroke();c.globalAlpha=1}
    c.fillStyle='#1a1540';c.beginPath();c.moveTo(0,H);c.lineTo(0,H-70);c.quadraticCurveTo(90,H-110,180,H-60);c.quadraticCurveTo(270,H-20,W,H-80);c.lineTo(W,H);c.fill();
  },
  space(c,now,th){
    const g=c.createLinearGradient(0,0,0,H);g.addColorStop(0,th.bg[0]);g.addColorStop(1,th.bg[1]);c.fillStyle=g;c.fillRect(0,0,W,H);
    [['#7b4bff55',80,120,110],['#ff4bb455',290,300,90]].forEach(n=>{const r=c.createRadialGradient(n[1],n[2],5,n[1],n[2],n[3]);r.addColorStop(0,n[0]);r.addColorStop(1,'#0000');c.fillStyle=r;c.fillRect(0,0,W,H)});
    c.fillStyle='#fff';STARS.forEach(s=>{c.globalAlpha=.3+.7*Math.abs(Math.sin(now/700+s.p));c.fillRect(s.x,s.y*1.3,s.r,s.r)});c.globalAlpha=1;
    c.fillStyle='#ffffff14';c.beginPath();c.arc(W-30,H-50,90,0,7);c.fill();
  },
  food(c,now,th){
    c.fillStyle=th.bg[1];c.fillRect(0,0,W,H);
    const s=40;for(let y=0;y<H;y+=s)for(let x=0;x<W;x+=s)if(((x+y)/s)%2===0){c.fillStyle='#ffffff0d';c.fillRect(x,y,s,s)}
    for(let i=0;i<8;i++){const x=(i*61+now/40)%W,y=(i*83)%H;c.fillStyle='#ffd16622';c.beginPath();c.arc(x,y,16+(i%3)*8,0,7);c.fill()}
  }
};

/* ───────── 게임 상태 ───────── */
const cv=document.getElementById('c'),ctx=cv.getContext('2d');
const nc=document.getElementById('nc'),nctx=nc.getContext('2d');
let dpr=1,scale=1;
let engine,blobs,mode,rng,queue,curLevel,nextLevel,aimX,dropReady,score,over,combo,comboT,fx,usedRevive,bombMode,runMerged,maxLevel,t0,shakeT;
const $=id=>document.getElementById(id);

function resize(){
  const st=$('stage'),aw=st.clientWidth,ah=st.clientHeight;
  scale=Math.min(aw/W,ah/H);dpr=Math.min(window.devicePixelRatio||1,2);
  cv.style.width=W*scale+'px';cv.style.height=H*scale+'px';
  cv.width=W*scale*dpr;cv.height=H*scale*dpr;
}
window.addEventListener('resize',resize);

function newGame(m){
  mode=m;over=false;score=0;combo=0;comboT=0;fx=[];usedRevive=false;bombMode=false;maxLevel=0;runMerged=0;shakeT=0;
  blobs=[];
  engine=Engine.create({enableSleeping:false});engine.gravity.y=1.1;
  const o={isStatic:true,friction:.2,restitution:.05};
  World.add(engine.world,[Bodies.rectangle(W/2,H+WALL/2,W+200,WALL,o),Bodies.rectangle(-WALL/2,H/2,WALL,H*3,o),Bodies.rectangle(W+WALL/2,H/2,WALL,H*3,o)]);
  Events.on(engine,'collisionStart',onCollide);
  rng=mode==='daily'?mulberry(dateSeed(todayKey())):Math.random;
  queue=[];curLevel=pull();nextLevel=pull();aimX=W/2;dropReady=true;t0=performance.now();
  document.documentElement.style.setProperty('--x','0');
    $('bestl').textContent=mode==='daily'?'오늘 최고':'BEST';
  refreshUI();
}
function pull(){return Math.floor(rng()*5*.999)} // 0~4 단계
function bestFor(){return mode==='daily'?store.get('daily_'+todayKey(),0):S.best}

function addBlob(x,y,l,vy){
  const b=Bodies.circle(x,y,RAD[l],{restitution:.18,friction:.15,frictionAir:.002,density:.001+l*.00004,label:'blob'});
  b.lvl=l;b.born=performance.now();b.merging=false;b.sq=0;
  if(vy)Body.setVelocity(b,{x:0,y:vy});
  World.add(engine.world,b);blobs.push(b);return b;
}
function removeBlob(b){World.remove(engine.world,b);const i=blobs.indexOf(b);if(i>=0)blobs.splice(i,1)}

function onCollide(ev){
  for(const p of ev.pairs){
    const a=p.bodyA,b=p.bodyB;
    if(a.label!=='blob'||b.label!=='blob')continue;
    a.sq=b.sq=1;
    if(a.lvl!==b.lvl||a.merging||b.merging)continue;
    a.merging=b.merging=true;
    const l=a.lvl,x=(a.position.x+b.position.x)/2,y=(a.position.y+b.position.y)/2;
    setTimeout(()=>{ if(over)return;
      removeBlob(a);removeBlob(b);
      const now=performance.now();
      combo=(now-comboT<1100)?combo+1:1;comboT=now;runMerged++;
      if(l===N-1){ // 최종체 둘이 만나면 팡!
        score+=SCORE[l]*4;burst(x,y,l,40);sfxMerge(l,combo+4);vib([30,40,60]);
      }else{
        const nb=addBlob(x,y,l+1);nb.sq=1;
        score+=SCORE[l+1]*(1+Math.floor((combo-1)/2)*.5);
        if(l+1>maxLevel){maxLevel=l+1;unlock(l+1)}
        burst(x,y,l+1,10+l*3);sfxMerge(l+1,combo);vib(combo>2?[15,20,25]:12);
        // 주변 밀어내기
        for(const o of blobs){if(o===nb)continue;const dx=o.position.x-x,dy=o.position.y-y,d=Math.hypot(dx,dy)||1;
          if(d<RAD[l+1]*2.2){const f=.0006*o.mass*(1-d/(RAD[l+1]*2.2));Body.applyForce(o,o.position,{x:dx/d*f,y:dy/d*f})}}
      }
      if(combo>=2){const c=$('combo');c.textContent=combo+' COMBO!';c.classList.add('show');clearTimeout(c._t);c._t=setTimeout(()=>c.classList.remove('show'),700)}
      score=Math.round(score);updateScore();
    },0);
  }
}
function burst(x,y,l,n){const c=THEMES[S.theme].levels[l][1];
  for(let i=0;i<n;i++){const a=Math.random()*7,s=1+Math.random()*3.5;fx.push({x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s-1,life:1,c,r:2+Math.random()*3})}}

/* ───────── 도감 ───────── */
function unlock(l){const k=S.theme;S.dex[k]=S.dex[k]||[];if(!S.dex[k].includes(l)){S.dex[k].push(l);store.set('dex',S.dex);toast('🎉 새 몽글이 발견: '+THEMES[k].levels[l][0])}}
function toast(t){const c=$('combo');c.textContent=t;c.classList.add('show');clearTimeout(c._t);c._t=setTimeout(()=>c.classList.remove('show'),1400)}
function openDex(){
  const k=S.theme,got=S.dex[k]||[0,1,2,3,4].filter(()=>false);
  const known=new Set(got.concat([0]));
  $('dexInfo').textContent=`${THEMES[k].name} · ${known.size}/${N} 수집`+(known.has(N-1)?' 🏆 컴플리트! 몽글이들이 하늘로 돌아갔어요':' · 몽글이를 탭하면 이야기가 나와요');
  const box=$('dex');box.innerHTML='';
  THEMES[k].levels.forEach((t,i)=>{
    const d=document.createElement('div');if(!known.has(i))d.className='lock';
    const c=document.createElement('canvas');c.width=c.height=96;
    drawBlob(c.getContext('2d'),48,48,40,i,{happy:true});
    d.appendChild(c);d.appendChild(document.createTextNode(known.has(i)?t[0]:'???'));d.onclick=()=>{$('dexInfo').textContent=known.has(i)?`${t[0]} — ${t[4]||''}`:'아직 만나지 못한 몽글이예요. 합쳐서 찾아보세요!'};box.appendChild(d)});
  show('ovDex');
}

/* ───────── UI ───────── */
function show(id){$(id).classList.add('on')}function hide(id){$(id).classList.remove('on')}
function updateScore(){$('score').textContent=score;const b=Math.max(bestFor(),score);$('best').textContent=b}
function refreshUI(){
  updateScore();
  $('nShake').textContent=S.items.shake>0?`보유 ${S.items.shake}`:'📺 광고';
  $('nBomb').textContent=S.items.bomb>0?`보유 ${S.items.bomb}`:'📺 광고';
  $('bBomb').classList.toggle('hot',bombMode);
  $('mSound').textContent=S.sound?'🔊 소리 켬':'🔇 소리 끔';
  $('mVib').textContent=S.vib?'📳 진동 켬':'📴 진동 끔';
  $('noAdsState').textContent=S.noAds?'구매 완료':'₩3,900';
  $('dailyInfo').textContent=todayKey()+' · 오늘 최고 '+store.get('daily_'+todayKey(),0);
  drawNext();
}
function drawNext(){nctx.clearRect(0,0,88,88);if(nextLevel!=null)drawBlob(nctx,44,44,Math.min(RAD[nextLevel],38)*(38/RAD[4]>1?1:1),nextLevel)}
function useItem(kind){
  if(over||!engine)return;
  const go=()=>{
    if(kind==='shake'){
      for(const b of blobs)Body.setVelocity(b,{x:(Math.random()-.5)*10,y:-4-Math.random()*5});
      vib([30,30,30]);tone(120,.3,'sawtooth',.12);
    }else{bombMode=!bombMode;if(bombMode)toast('💥 없앨 몽글이를 탭하세요');}
    refreshUI();
  };
  if(S.items[kind]>0){ if(kind==='shake'){S.items.shake--;store.set('items',S.items)} go(); if(kind==='bomb'&&!bombMode){} }
  else Monet.rewarded(ok=>{if(ok){S.items[kind]++;store.set('items',S.items);refreshUI()}});
}

/* ───────── 입력 ───────── */
function pointerX(e){const r=cv.getBoundingClientRect();return(e.clientX-r.left)/scale}
let dragging=false;
cv.addEventListener('pointerdown',e=>{
  if(over||!engine)return;if(AC&&AC.state==='suspended')AC.resume();
  const x=pointerX(e),y=(e.clientY-cv.getBoundingClientRect().top)/scale;
  if(bombMode){
    const hit=blobs.find(b=>Math.hypot(b.position.x-x,b.position.y-y)<RAD[b.lvl]);
    if(hit){ if(S.items.bomb>0){S.items.bomb--;store.set('items',S.items)}
      burst(hit.position.x,hit.position.y,hit.lvl,24);removeBlob(hit);tone(90,.35,'sawtooth',.2);vib(60);bombMode=false;refreshUI()}
    return;
  }
  dragging=true;cv.setPointerCapture(e.pointerId);aimX=x;
});
cv.addEventListener('pointermove',e=>{if(dragging)aimX=pointerX(e)});
function release(){if(!dragging)return;dragging=false;drop()}
cv.addEventListener('pointerup',release);cv.addEventListener('pointercancel',release);

function drop(){
  if(!dropReady||over)return;
  const r=RAD[curLevel],x=Math.max(r+2,Math.min(W-r-2,aimX));
  addBlob(x,r+8,curLevel,2);sfxDrop();vib(8);
  if(curLevel>maxLevel){maxLevel=curLevel;unlock(curLevel)}
  curLevel=nextLevel;nextLevel=pull();dropReady=false;drawNext();
  setTimeout(()=>{dropReady=true},550);
}

/* ───────── 게임오버 ───────── */
function checkOver(now){
  if(over)return;
  for(const b of blobs){
    if(now-b.born>1800&&b.position.y-RAD[b.lvl]<LINE&&Math.hypot(b.velocity.x,b.velocity.y)<1.2){
      b.overT=(b.overT||now);if(now-b.overT>1500)return end();
    }else b.overT=0;
  }
}
function end(){
  over=true;
  if(mode==='daily'){const k='daily_'+todayKey();if(score>store.get(k,0))store.set(k,score)}
  else if(score>S.best){S.best=score;store.set('best',score)}
  vib([80,40,80]);tone(150,.6,'sawtooth',.15);
  $('overInfo').innerHTML=`<span class="tag">${mode==='daily'?'📅 '+todayKey():'일반'}</span><br><b style="font-size:30px;color:var(--acc)">${score}</b> 점<br>최고 단계: ${THEMES[S.theme].levels[maxLevel][0]} · 합체 ${runMerged}회`;
  $('bRevive').style.display=usedRevive?'none':'';
  show('ovOver');updateScore();
}
function revive(){
  // 위쪽 3분의 1에 걸친 몽글이를 비운다
  blobs.filter(b=>b.position.y-RAD[b.lvl]<LINE+60).forEach(b=>{burst(b.position.x,b.position.y,b.lvl,12);removeBlob(b)});
  usedRevive=true;over=false;hide('ovOver');
  blobs.forEach(b=>{b.overT=0;b.born=performance.now()});
}

/* ───────── 메인 루프 ───────── */
let last=performance.now(),acc=0;
function frame(now){
  requestAnimationFrame(frame);
  if(!engine)return;
  const dt=Math.min(now-last,50);last=now;
  if(!over){acc+=dt;while(acc>=1000/120){Engine.update(engine,1000/120);acc-=1000/120}}
  if(combo&&now-comboT>1200)combo=0;
  checkOver(now);
  render(now);
}
function render(now){
  ctx.setTransform(scale*dpr,0,0,scale*dpr,0,0);const _th=THEMES[S.theme];SCENES[_th.scene](ctx,now,_th);
  // 위험선
  const warn=blobs.some(b=>b.overT);
  ctx.setLineDash([8,8]);ctx.strokeStyle=warn?'#ff5470':'#ffffff44';ctx.lineWidth=warn&&Math.floor(now/200)%2?3:2;
  ctx.beginPath();ctx.moveTo(0,LINE);ctx.lineTo(W,LINE);ctx.stroke();ctx.setLineDash([]);
  // 조준
  if(!over&&dropReady&&!bombMode){
    const r=RAD[curLevel],x=Math.max(r+2,Math.min(W-r-2,aimX));
    ctx.strokeStyle='#ffffff30';ctx.setLineDash([4,6]);ctx.beginPath();ctx.moveTo(x,r*2+10);ctx.lineTo(x,H);ctx.stroke();ctx.setLineDash([]);
    drawBlob(ctx,x,r+8,r,curLevel,{});
  }else if(!over&&!bombMode){const r=RAD[curLevel];ctx.globalAlpha=.35;drawBlob(ctx,Math.max(r+2,Math.min(W-r-2,aimX)),r+8,r,curLevel,{});ctx.globalAlpha=1}
  for(const b of blobs){
    b.sq*=.9;
    const near=Math.hypot(b.velocity.x,b.velocity.y)>2;
    drawBlob(ctx,b.position.x,b.position.y,RAD[b.lvl],b.lvl,{a:b.angle,sq:b.sq,happy:b.sq>.2||near&&b.lvl>3});
    if(bombMode){ctx.strokeStyle='#ff547088';ctx.lineWidth=2;ctx.beginPath();ctx.arc(b.position.x,b.position.y,RAD[b.lvl]+3,0,7);ctx.stroke()}
  }
  for(let i=fx.length-1;i>=0;i--){const p=fx[i];p.x+=p.vx;p.y+=p.vy;p.vy+=.12;p.life-=.025;
    if(p.life<=0){fx.splice(i,1);continue}
    ctx.globalAlpha=p.life;ctx.fillStyle=p.c;ctx.beginPath();ctx.arc(p.x,p.y,p.r*p.life,0,7);ctx.fill();ctx.globalAlpha=1}
}

/* ───────── 버튼 연결 ───────── */
function start(m){hide('ovStart');hide('ovOver');hide('ovMenu');newGame(m)}
$('goNormal').onclick=()=>start('normal');
$('goDaily').onclick=()=>start('daily');
$('goDex').onclick=openDex;$('bDex').onclick=openDex;$('dexClose').onclick=()=>hide('ovDex');
$('goTheme').onclick=openTheme;$('themeClose').onclick=()=>hide('ovTheme');
$('bShake').onclick=()=>useItem('shake');
$('bBomb').onclick=()=>{if(bombMode){bombMode=false;refreshUI()}else useItem('bomb')};
$('bMenu').onclick=()=>{refreshUI();show('ovMenu')};$('mClose').onclick=()=>hide('ovMenu');
$('mSound').onclick=()=>{S.sound=!S.sound;store.set('sound',S.sound);refreshUI()};
$('mVib').onclick=()=>{S.vib=!S.vib;store.set('vib',S.vib);refreshUI()};
$('mNoAds').onclick=()=>Monet.buyNoAds();
$('mRestart').onclick=()=>start(mode||'normal');
$('bRetry').onclick=()=>start(mode);
$('bHome').onclick=()=>{hide('ovOver');refreshUI();show('ovStart')};
$('bRevive').onclick=()=>Monet.rewarded(ok=>{if(ok)revive()});
$('bShare').onclick=()=>{
  const t=`🫧 Blob Drop ${mode==='daily'?todayKey()+' 데일리':''} ${score}점 · 최고 단계 ${THEMES[S.theme].levels[maxLevel][0]}\n${location.href.split('?')[0]}`;
  if(navigator.share)navigator.share({text:t}).catch(()=>{});
  else if(navigator.clipboard)navigator.clipboard.writeText(t).then(()=>alert('복사되었습니다!'));
};
function openTheme(){
  const box=$('themeList');box.innerHTML='';
  Object.keys(THEMES).forEach(k=>{
    const b=document.createElement('button');b.style.cssText='display:block;width:100%;margin:6px 0';
    b.textContent=(k===S.theme?'✅ ':'')+THEMES[k].name+' ('+((S.dex[k]||[]).length)+'/'+N+')';
    b.onclick=()=>{S.theme=k;store.set('theme',k);hide('ovTheme');refreshUI()};
    box.appendChild(b)});
  show('ovTheme');
}

resize();newGame('normal');refreshUI();requestAnimationFrame(frame);
// 테스트/디버그용 훅
window.__bd={get blobs(){return blobs},get score(){return score},addBlob,drop,get over(){return over}};
})();
</script>
