<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#1b1535">
<title>Blob Drop — 몽글몽글 합체 퍼즐</title>
<meta name="description" content="같은 몽글이를 떨어뜨려 합치고 진화시키는 물리 머지 퍼즐. 데일리 챌린지와 도감 수집.">
<style>
:root{--bg:#1b1535;--panel:#2a2250;--ink:#fff;--sub:#b9b0e6;--acc:#ffd166;--acc2:#ff7eb6}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none}
html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);font-family:-apple-system,"Apple SD Gothic Neo","Noto Sans KR",sans-serif;overflow:hidden;touch-action:none}
#app{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;padding:env(safe-area-inset-top) 8px env(safe-area-inset-bottom)}
#hud{width:100%;max-width:440px;display:flex;align-items:center;justify-content:space-between;padding:8px 4px;gap:8px}
.stat{background:var(--panel);border-radius:12px;padding:4px 12px;min-width:76px;text-align:center}
.stat small{display:block;font-size:10px;color:var(--sub)}
.stat b{font-size:18px}
#next{display:flex;align-items:center;gap:6px}
#next canvas{width:44px;height:44px;background:var(--panel);border-radius:50%}
#stage{position:relative;flex:1;width:100%;max-width:440px;min-height:0}
#c{position:absolute;left:50%;top:0;transform:translateX(-50%);border-radius:14px;background:linear-gradient(#2d2560,#211a47)}
#combo{position:absolute;left:0;right:0;top:12%;text-align:center;font-size:34px;font-weight:900;color:var(--acc);text-shadow:0 3px 0 #0006;pointer-events:none;opacity:0;transition:opacity .2s,transform .2s}
#combo.sm{font-size:18px;padding:0 20px;top:22%}
#combo.show{opacity:1;transform:scale(1.15)}
#bar{width:100%;max-width:440px;display:flex;gap:6px;padding:8px 0}
button{font:inherit;color:var(--ink);background:var(--panel);border:0;border-radius:12px;padding:10px 6px;flex:1;font-weight:700;font-size:13px;cursor:pointer}
button:active{transform:scale(.96)}
button.hot{background:var(--acc2)}
button small{display:block;font-weight:400;font-size:10px;color:var(--sub)}
.ov{position:fixed;inset:0;background:#000b;display:none;align-items:center;justify-content:center;z-index:5;padding:16px}
.ov.on{display:flex}
.card{background:var(--panel);border-radius:20px;padding:20px;width:100%;max-width:400px;max-height:90vh;overflow:auto;text-align:center}
.card h2{margin:0 0 4px}.card p{color:var(--sub);font-size:13px;margin:6px 0 12px}
.card .row{display:flex;gap:8px;margin-top:8px}
.card button.big{padding:14px;font-size:16px;background:var(--acc);color:#2a1a00}
#dex{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin:10px 0}
#dex div{font-size:11px;color:var(--sub)}#dex canvas{width:100%;aspect-ratio:1}
#dex .lock canvas{filter:brightness(0) opacity(.35)}
#goal{width:100%;max-width:440px;display:none;align-items:center;gap:8px;background:var(--panel);border-radius:12px;padding:6px 10px;margin-bottom:2px}
#goal.on{display:flex}
#goal canvas{width:28px;height:28px;flex:none}
#goal .t{flex:1;font-size:12px;font-weight:700;min-width:0}
#goal .bar{height:6px;background:#0005;border-radius:99px;margin-top:4px;overflow:hidden}
#goal .bar i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--acc2),var(--acc));transition:width .3s}
.tag{display:inline-block;background:#0004;border-radius:99px;padding:2px 10px;font-size:11px;color:var(--acc)}
</style>
</head>
<body>
<div id="app">
  <div id="hud">

<div class="ov on" id="ovStart"><div class="card">

  <div class="row"><button class="big" id="goStage" style="background:#7ee8b0">🏁 스테이지 모드<small id="stageInfo" style="color:#154"></small></button></div>
  <div class="row" id="rowStageNew" style="display:none"><button id="goStageNew">스테이지 처음부터</button></div>
  <div class="row"><button class="big" id="goNormal">일반 모드</button></div>
  <div class="row"><button class="big" id="goDaily" style="background:var(--acc2);color:#fff">🌠 오늘의 별똥<small id="dailyInfo"></small></button></div>
  <div class="row"><button id="goDex">📖 도감</button><button id="goTheme">🎨 테마</button></div>
</div></div>

<div class="ov" id="ovOver"><div class="card">
  <h2>상자가 넘쳤어요!</h2>
  <p id="overInfo"></p>
  <div class="row"><button class="big" id="bRevive">📺 광고 보고 한 칸 비우기<small>(이어하기 1회)</small></button></div>
  <div class="row"><button id="bShare">📋 결과 공유</button><button id="bRetry">다시 하기</button></div>
  <div class="row"><button id="bHome">처음으로</button></div>
</div></div>

<div class="ov" id="ovClear"><div class="card">
  <h2>🎉 스테이지 클리어!</h2>
  <p id="clearInfo"></p>
  <div class="row"><button class="big" id="bNext">다음 스테이지 ▶</button></div>
  <div class="row"><button id="bClearHome">처음으로</button></div>
</div></div>

<div class="ov" id="ovDex"><div class="card">
  <h2>📖 몽글이 도감</h2><p id="dexInfo"></p><div id="dex"></div>
  <button id="dexClose">닫기</button>

<div class="ov" id="ovTheme"><div class="card">

  <button id="themeClose" style="margin-top:10px">닫기</button>

<div class="ov" id="ovMenu"><div class="card">

  <div class="row"><button id="mRestart">다시 시작</button><button id="mClose">닫기</button></div>
</div></div>

function mulberry(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}

let AC=null;
function tone(f,d,type,vol,when){ if(!S.sound)return;
  try{AC=AC||new (window.AudioContext||window.webkitAudioContext)();
    const t=AC.currentTime+(when||0),o=AC.createOscillator(),g=AC.createGain();
    o.type=type||'sine';o.frequency.setValueAtTime(f,t);o.frequency.exponentialRampToValueAtTime(f*1.5,t+d*.6);
    g.gain.setValueAtTime(vol||.15,t);g.gain.exponentialRampToValueAtTime(.001,t+d);
    o.connect(g);g.connect(AC.destination);o.start(t);o.stop(t+d)}catch(e){}}

/* ───────── BGM (테마별 실시간 합성, 음원 파일 없음) ───────── */
function getAC(){AC=AC||new (window.AudioContext||window.webkitAudioContext)();return AC}
const mf=m=>440*Math.pow(2,(m-69)/12);
const SONGS={
  jelly:{bpm:84,chords:[[60,64,67],[57,60,64],[53,57,60],[55,59,62]],arp:'sine',pad:'triangle',pat:[0,1,2,1,2,1,2,1],tick:0},
  space:{bpm:70,chords:[[62,65,69],[58,62,65],[53,57,60],[60,64,67]],arp:'sine',pad:'sawtooth',pat:[0,2,1,2,0,2,1,2],tick:0,echo:.45},
  food:{bpm:116,chords:[[65,69,72],[62,65,69],[58,62,65],[60,64,67]],arp:'triangle',pad:'sine',pat:[0,2,1,2,0,2,1,2],tick:1,stac:1},
  winter:{bpm:76,chords:[[57,60,64],[53,57,60],[60,64,67],[55,59,62]],arp:'sine',pad:'triangle',pat:[2,1,0,1,2,1,0,1],tick:0,bell:1,echo:.4},
  spring:{bpm:98,chords:[[67,71,74],[64,67,71],[60,64,67],[62,66,69]],arp:'triangle',pad:'sine',pat:[0,1,2,1,0,2,1,2],tick:1},
  halloween:{bpm:100,chords:[[64,67,71],[60,64,67],[59,63,66],[64,67,71]],arp:'sawtooth',pad:'sawtooth',pat:[0,2,1,2,0,1,2,1],tick:1,dark:1}
};
const Music={on:false,step:0,next:0,timer:null,master:null,out:null,cfg:null,key:null,level:1,
  start(k){
    this.stop();if(!S.music)return;
    try{const ac=getAC();if(ac.state==='suspended')ac.resume();
      this.key=k;this.cfg=SONGS[k]||SONGS.jelly;
      this.master=ac.createGain();this.master.gain.value=0;this.master.connect(ac.destination);
      this.master.gain.setTargetAtTime(.5*this.level,ac.currentTime,.6);
      const dl=ac.createDelay(1);dl.delayTime.value=60/this.cfg.bpm*.75;const fb=ac.createGain();fb.gain.value=this.cfg.echo||.28;
      const lp=ac.createBiquadFilter();lp.type='lowpass';lp.frequency.value=2400;
      dl.connect(lp);lp.connect(fb);fb.connect(dl);lp.connect(this.master);this.echo=dl;
      this.step=0;this.next=ac.currentTime+.15;this.on=true;
      this.timer=setInterval(()=>this.tick(),30);
    }catch(e){this.on=false}
  },
  stop(){
    clearInterval(this.timer);this.on=false;
    if(this.master){const m=this.master,ac=AC;try{m.gain.setTargetAtTime(0,ac.currentTime,.15);setTimeout(()=>{try{m.disconnect()}catch(e){}},900)}catch(e){}this.master=null}
  },
  setLevel(v){this.level=v;if(this.master&&AC)this.master.gain.setTargetAtTime(.5*v,AC.currentTime,.4)},
  tick(){
    const ac=AC;if(!ac||!this.on)return;
    const dur=60/this.cfg.bpm/2;
    while(this.next<ac.currentTime+.25){this.play(this.step,this.next,dur);this.next+=dur;this.step++}
  },
  voice(f,t,d,type,v,dest,att,cut){
    const ac=AC,o=ac.createOscillator(),g=ac.createGain();o.type=type;o.frequency.value=f;
    g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(v,t+(att||.01));g.gain.exponentialRampToValueAtTime(.0008,t+d);
    let n=o;if(cut){const fl=ac.createBiquadFilter();fl.type='lowpass';fl.frequency.value=cut;o.connect(fl);n=fl}
    n.connect(g);g.connect(dest||this.master);if(dest!==this.echo&&this.cfg.echo&&type===this.cfg.arp&&!cut)g.connect(this.echo);
    o.start(t);o.stop(t+d+.05);
  },
  play(step,t,dur){
    const c=this.cfg,bar=Math.floor(step/8)%c.chords.length,s=step%8,ch=c.chords[bar];
    if(s===0){ // 패드
      ch.forEach((m,i)=>this.voice(mf(m-12+(i?0:0)),t,dur*8,c.pad,.05,null,dur*2,c.dark?500:900));
      this.voice(mf(ch[0]-24),t,dur*4,'sine',.2,null,.02);
    }
    if(s===4)this.voice(mf(ch[0]-24+(c.stac?7:0)),t,dur*3,'sine',.16,null,.02);
    // 아르페지오
    const idx=c.pat[s],oct=(bar%2&&s>3)?12:0,m=ch[idx]+(c.bell?12:0)+oct;
    const d=c.stac?dur*.5:c.bell?dur*3:dur*1.8;
    this.voice(mf(m),t,d,c.arp,c.bell?.07:.09,null,.008,c.dark?1400:0);
    if(c.tick&&s%2===1){ // 가벼운 틱
      const ac=AC,b=ac.createBuffer(1,2205,ac.sampleRate),dd=b.getChannelData(0);for(let i=0;i<dd.length;i++)dd[i]=(Math.random()*2-1)*(1-i/dd.length);
      const src=ac.createBufferSource();src.buffer=b;const hp=ac.createBiquadFilter();hp.type='highpass';hp.frequency.value=6000;const g=ac.createGain();g.gain.value=.06;src.connect(hp);hp.connect(g);g.connect(this.master);src.start(t)}
    // 멜로디 포인트 (2마디마다 위로 올라가는 짧은 장식음)
    if(s===6&&bar%2===1)this.voice(mf(ch[2]+12),t,dur*2.5,c.bell?'sine':c.arp,.06,null,.01,c.dark?1400:0);
  }
};

/* ───────── 슬라임 충돌음 (찰진 소리: 둔탁한 몸통음 + 끈적한 스퀠치 + 젖은 노이즈 + 방울) ───────── */
let lastSplat=0,NOISE=null;
function slimeSplat(str,lvl){ // str 0~1(충격 세기), lvl 0~10(크기)
  if(!S.sound)return;const now=performance.now();if(now-lastSplat<45)return;lastSplat=now;
  try{const ac=getAC(),t=ac.currentTime,sz=lvl/10,v=.08+str*.22,dest=ac.destination;
    // 1) 몸통: 크기가 클수록 낮고 길게
    const o=ac.createOscillator(),g=ac.createGain();o.type='sine';
    o.frequency.setValueAtTime(180-sz*95,t);o.frequency.exponentialRampToValueAtTime(38,t+.22+sz*.12);
    g.gain.setValueAtTime(v,t);g.gain.exponentialRampToValueAtTime(.001,t+.26+sz*.14);o.connect(g);g.connect(dest);o.start(t);o.stop(t+.45);
    // 2) 스퀠치: 필터가 닫히며 "찌익" 눌리는 끈적한 소리
    const s=ac.createOscillator(),sg=ac.createGain(),lp=ac.createBiquadFilter();s.type='sawtooth';
    s.frequency.setValueAtTime(280-sz*110,t);s.frequency.exponentialRampToValueAtTime(65,t+.15);
    lp.type='lowpass';lp.Q.value=10;lp.frequency.setValueAtTime(2400,t);lp.frequency.exponentialRampToValueAtTime(240,t+.17);
    sg.gain.setValueAtTime(0,t);sg.gain.linearRampToValueAtTime(v*.75,t+.006);sg.gain.exponentialRampToValueAtTime(.001,t+.2);
    s.connect(lp);lp.connect(sg);sg.connect(dest);s.start(t);s.stop(t+.25);
    // 3) 젖은 노이즈: 찰싹
    if(!NOISE){NOISE=ac.createBuffer(1,ac.sampleRate*.15,ac.sampleRate);const d=NOISE.getChannelData(0);for(let i=0;i<d.length;i++)d[i]=Math.random()*2-1}
    const n=ac.createBufferSource(),bp=ac.createBiquadFilter(),ng=ac.createGain();n.buffer=NOISE;bp.type='bandpass';bp.Q.value=1.2;
    bp.frequency.setValueAtTime(1600,t);bp.frequency.exponentialRampToValueAtTime(450,t+.12);
    ng.gain.setValueAtTime(v*.55,t);ng.gain.exponentialRampToValueAtTime(.001,t+.12);n.connect(bp);bp.connect(ng);ng.connect(dest);n.start(t);
    // 4) 방울: 세게 칠수록 "뽀글" 더 많이
    const nb=1+Math.floor(str*3);
    for(let i=0;i<nb;i++){const bt=t+.035+i*.05,b=ac.createOscillator(),bg=ac.createGain(),f=240+Math.random()*260;b.type='sine';
      b.frequency.setValueAtTime(f,bt);b.frequency.exponentialRampToValueAtTime(f*2.2,bt+.085);
      bg.gain.setValueAtTime(0,bt);bg.gain.linearRampToValueAtTime(v*.5,bt+.01);bg.gain.exponentialRampToValueAtTime(.001,bt+.11);
      b.connect(bg);bg.connect(dest);b.start(bt);b.stop(bt+.13)}
  }catch(e){}
}
// 충돌 촉감: 세기에 비례하는 "쿵→찰랑" 햅틱 패턴 (진동 지원 기기에서)
function slimeHaptic(str){
  const p=Math.round(8+str*34);
  vib(str>.55?[p,18,Math.round(p*.5),22,Math.round(p*.28)]:str>.25?[p,16,Math.round(p*.45)]:p);
}
// 충돌 하나를 소리·진동·화면흔들림·튀는 파티클로 변환
function impact(a,b,rv,pt){
  if(rv<1.6||performance.now()-t0<900)return; // 스테이지 시작 시 사전 배치가 쌓이는 소리는 생략
  const ba=a.label==='blob'?a:null,bb=b.label==='blob'?b:null;if(!ba&&!bb)return;
  const str=Math.min(1,(rv-1.2)/11),lvl=Math.max(ba?ba.lvl:0,bb?bb.lvl:0);
  slimeSplat(str,lvl);slimeHaptic(str);
  if(str>.45)shake=Math.max(shake,str*(2+lvl*.35));
  if(str>.35&&pt){const l=ba?ba.lvl:bb.lvl,c=THEMES[S.theme].levels[l][1],n=Math.round(3+str*8);

}

function sfxDrop(){tone(180,.12,'sine',.12)}

/* ───────── 몽글이 그리기 (반3D 렌더링 & 고해상도 캐시) ───────── */
let BLOB_CACHE = {}, BLOB_CACHE_THEME = null;
// 젤리 투명도: 가운데는 비치고 가장자리는 진해서(프레넬) 유리알처럼 보임. 0(완전 투명)~1(불투명)
const BLOB_ALPHA = { core: 0.58, mid: 0.7, edge: 0.92 };
const hexA = (hex, a) => `rgba(${parseInt(hex.slice(1,3),16)},${parseInt(hex.slice(3,5),16)},${parseInt(hex.slice(5,7),16)},${a})`;

function getBlobCache(theme, l, r, happy) {
  if (BLOB_CACHE_THEME !== theme) { BLOB_CACHE = {}; BLOB_CACHE_THEME = theme; } // 테마 교체 시 이전 캐시 폐기(메모리 절약)
  const key = `${l}_${Math.round(r)}_${happy ? 1 : 0}`;
  if (BLOB_CACHE[key]) return BLOB_CACHE[key];

  const th = THEMES[theme].levels[l];
  const pad = r * 0.2; // 찌그러짐/하이라이트를 위한 여백
  const size = r * 2 + pad * 2;
  const cvs = document.createElement('canvas');
  const RES = 2; // 모바일 고해상도 대응
  cvs.width = size * RES;
  cvs.height = size * RES;
  const c = cvs.getContext('2d');
  c.scale(RES, RES);
  c.translate(size / 2, size / 2);

  // 어두운 몽글이 판별 (림라이트 강도 조절용)
  const hex = th[1];
  const lum = 0.299 * parseInt(hex.slice(1,3),16) + 0.587 * parseInt(hex.slice(3,5),16) + 0.114 * parseInt(hex.slice(5,7),16);
  const isDark = lum < 125;

  // 1. 코어 젤리 그라데이션 (구체감)
  const g = c.createRadialGradient(-r * 0.35, -r * 0.4, r * 0.1, 0, 0, r);
  g.addColorStop(0, hexA(th[1], BLOB_ALPHA.core)); g.addColorStop(0.65, hexA(th[2], BLOB_ALPHA.mid)); g.addColorStop(1, hexA(th[2], BLOB_ALPHA.edge));
  c.fillStyle = g; c.beginPath(); c.arc(0, 0, r, 0, 7); c.fill();

  // 몸 안쪽을 통과해 아래쪽에 맺히는 빛(투명한 젤리 느낌)
  c.save(); c.globalCompositeOperation = 'source-atop';
  const tr = c.createRadialGradient(r * 0.2, r * 0.5, 0, r * 0.2, r * 0.5, r * 0.65);
  tr.addColorStop(0, hexA(th[1], 0.55)); tr.addColorStop(1, hexA(th[1], 0));
  c.fillStyle = tr; c.beginPath(); c.arc(0, 0, r, 0, 7); c.fill();
  c.restore();

  // 2. 이너 반사광 / 림라이트 (유리알 느낌 & 배경 분리)
  c.save();
  c.globalCompositeOperation = 'source-atop';
  const rim = c.createRadialGradient(r * 0.1, r * 0.2, r * 0.6, 0, 0, r);
  rim.addColorStop(0, 'transparent');
  rim.addColorStop(1, isDark ? '#ffffffbb' : '#ffffff55'); // 어두우면 림라이트를 강하게
  c.fillStyle = rim; c.beginPath(); c.arc(0, 0, r, 0, 7); c.fill();
  c.restore();

  // 3. 스펙큘러 하이라이트 (매끄러운 표면)
  c.fillStyle = '#ffffff66'; c.beginPath(); c.ellipse(-r * 0.3, -r * 0.4, r * 0.22, r * 0.12, -0.6, 0, 7); c.fill();
  c.fillStyle = '#ffffffaa'; c.beginPath(); c.ellipse(-r * 0.4, -r * 0.45, r * 0.08, r * 0.04, -0.6, 0, 7); c.fill();

  // 4. 얇은 테두리 그림자 (경계선)
  c.strokeStyle = '#00000033'; c.lineWidth = Math.max(1.5, r * 0.05); c.beginPath(); c.arc(0, 0, r, 0, 7); c.stroke();

  // 5. 표정 레이어 (입체감을 위해 95% 스케일) — 평상시/행복 두 종류를 각각 구워 둠
  const ex = r * 0.32, ey = -r * 0.05, er = Math.max(2, r * 0.13);
  c.save();
  c.scale(1, 0.95);
  c.fillStyle = '#2b1d3a';
  if (happy) {
    c.lineWidth = Math.max(1.5, r * 0.07); c.strokeStyle = '#2b1d3a'; c.lineCap = 'round';
    [-1, 1].forEach(s => { c.beginPath(); c.arc(s * ex, ey + er * 0.4, er, Math.PI * 1.1, Math.PI * 1.9); c.stroke(); });
  } else {
    [-1, 1].forEach(s => {
      c.beginPath(); c.arc(s * ex, ey, er, 0, 7); c.fill();
      c.fillStyle = '#ffffff'; c.beginPath(); c.arc(s * ex + er * 0.2, ey - er * 0.2, er * 0.35, 0, 7); c.fill(); c.fillStyle = '#2b1d3a';
    });
  }
  c.fillStyle = '#ff6b9d66'; [-1, 1].forEach(s => { c.beginPath(); c.ellipse(s * r * 0.55, r * 0.2, r * 0.12, r * 0.08, 0, 0, 7); c.fill(); });
  c.strokeStyle = '#2b1d3a'; c.lineWidth = Math.max(1.5, r * 0.06); c.lineCap = 'round';
  c.beginPath(); c.arc(0, r * 0.18, r * 0.14, 0.15 * Math.PI, 0.85 * Math.PI); c.stroke();
  c.restore();

  // 6. 배지 (스케일 밖에서 그려 위치 왜곡 방지) — 텍스트 렌더링 비용을 없애려고 캐시에 포함
  if (th[3] !== '·' && r >= 26) {
    c.font = Math.round(r * 0.4) + 'px serif'; c.textAlign = 'center'; c.textBaseline = 'middle';
    c.fillStyle = '#00000044'; c.fillText(th[3], 0, -r * 0.68 + 2); // 배지 그림자
    c.fillStyle = '#ffffff'; c.fillText(th[3], 0, -r * 0.68);
  }

  BLOB_CACHE[key] = cvs;
  return cvs;
}

function drawBlob(ctx, x, y, r, l, o) {
  o = o || {};
  const k = o.k || 0, sc = o.s == null ? 1 : o.s;

  ctx.save();
  ctx.translate(x, y); ctx.scale(sc, sc);
  if (k) { ctx.rotate(o.ka || 0); ctx.scale(1 - k, 1 + k * 0.9); ctx.rotate(-(o.ka || 0)); }
  ctx.rotate(o.a || 0);

  // 캐시된 스프라이트(몸 + 표정 + 배지)를 논리 크기로 그림 — 프레임당 drawImage 1회
  const cache = getBlobCache(S.theme, l, r, !!o.happy);
  const size = r * 2.4;
  ctx.drawImage(cache, -size / 2, -size / 2, size, size);
  ctx.restore();
}

function drawBlobShadows(ctx, blobs) {
  ctx.fillStyle = '#00000022';
  for (const b of blobs) {
    const r = RAD[b.lvl];
    // 바닥(y=560 근처)에 있는 몽글이에게만 접촉 그림자 렌더링
    if (b.position.y + r > H - 30) {
      const alpha = Math.max(0, 1 - (H - (b.position.y + r)) / 30);
      ctx.globalAlpha = alpha;
      ctx.beginPath(); ctx.ellipse(b.position.x, H - 5, r * 0.8, r * 0.15, 0, 0, 7); ctx.fill();
    }
  }
  ctx.globalAlpha = 1;
}


/* ───────── 배경 장면 (이미지 파일 없이 코드로 그림 · 테마별 교체) ───────── */
const STARS=Array.from({length:70},(_,i)=>({x:(i*97%360),y:(i*53%420),r:.6+(i%4)*.45,p:i*.7}));
function fall(c,now,col,n,size,speed,petal){
  c.fillStyle=col;
  for(let i=0;i<n;i++){const x=((i*71)%W+Math.sin(now/900+i)*18+W)%W,y=(i*131+now*speed*.05*(1+(i%3)*.4))%(H+20)-10,r=size*(.1+(i%4)*.05);
    c.beginPath();if(petal)c.ellipse(x,y,r*1.4,r*.8,now/700+i,0,7);else c.arc(x,y,Math.max(1,r*.3),0,7);c.fill()}
}
/* ── 배경 도구 ── */
function glow(c,x,y,r,col){const g=c.createRadialGradient(x,y,0,x,y,r);g.addColorStop(0,col);g.addColorStop(1,'#0000');c.fillStyle=g;c.fillRect(x-r,y-r,r*2,r*2)}
function sky(c,stops){const g=c.createLinearGradient(0,0,0,H);stops.forEach((s,i)=>g.addColorStop(i/(stops.length-1),s));c.fillStyle=g;c.fillRect(0,0,W,H)}
function hills(c,y,amp,col,seed,fr){c.fillStyle=col;c.beginPath();c.moveTo(0,H);for(let x=0;x<=W;x+=6)c.lineTo(x,y+Math.sin(x*fr+seed)*amp+Math.sin(x*fr*2.3+seed*2)*amp*.4);c.lineTo(W,H);c.fill()}
function pine(c,x,y,h,col){c.fillStyle=col;for(let i=0;i<4;i++){const w=h*.28*(1-i*.17),ty=y-h*(.25+i*.2);c.beginPath();c.moveTo(x-w,ty+h*.22);c.lineTo(x,ty-h*.12);c.lineTo(x+w,ty+h*.22);c.fill()}c.fillRect(x-h*.03,y-h*.1,h*.06,h*.12)}

let SCENE_CACHE = {}, SCENE_CACHE_KEY = null, VIGNETTE = null;
let LOWFX = false, slowFrames = 0, fEma = 16.7; // 프레임이 계속 느리면 시차를 끄고 배경을 1장으로 합쳐 그리는 저사양 모드로 자동 전환

function drawScene(c, now, th, key) {
  if (SCENE_CACHE_KEY !== key) { SCENE_CACHE = {}; SCENE_CACHE_KEY = key; } // 테마 교체 시 이전 배경 캐시 폐기(메모리 절약)
  let cache = SCENE_CACHE[key];
  if (!cache) {
    cache = [];
    SCENES[th.scene].base.forEach((layerFn, li) => {
      const o = document.createElement('canvas');
      o.width = W * 2; o.height = H * 2;
      const oc = o.getContext('2d');
      oc.scale(2, 2);
      layerFn(oc, th);
      // 중경/근경은 위쪽이 투명한 경우가 많아, 내용이 시작되는 행을 찾아 그 아래만 그린다(그리기 면적 절약)
      let y0 = 0;
      if (li > 0) {
        const d = oc.getImageData(0, 0, o.width, o.height).data, w4 = o.width * 4;
        scan: for (let y = 0; y < o.height; y += 2) for (let x = 3; x < w4; x += 16) if (d[y * w4 + x] > 8) { y0 = Math.max(0, y - 4); break scan; }
      }
      cache.push({ cv: o, y0 });
    });
    SCENE_CACHE[key] = cache;
  }

  if (LOWFX) { // 저사양 모드: 3겹을 1장으로 합쳐(1회) 한 번만 그림
    if (!cache.merged) {
      const o = document.createElement('canvas'); o.width = W * 2; o.height = H * 2;
      const oc = o.getContext('2d'); cache.forEach(L => oc.drawImage(L.cv, 0, 0)); cache.merged = o;
    }
    c.drawImage(cache.merged, 0, 0, W, H);
  } else {
    // 패럴랙스(시차): 레이어를 좌우로 살짝 넓혀 그려 가장자리에 틈이 생기지 않게 함
    const M = 5, p = [Math.sin(now / 2500) * 1, Math.sin(now / 2000) * 2, Math.sin(now / 1500) * 4];
    for (let i = 0; i < cache.length; i++) { const L = cache[i], sy = L.y0; c.drawImage(L.cv, 0, sy, W * 2, H * 2 - sy, p[i] - M, sy / 2, W + M * 2, H - sy / 2); }
  }

  SCENES[th.scene].anim(c, now);

  // 몽글이를 돋보이게 하는 가장자리 비네팅 & 대기 원근감 (그라데이션은 1회만 생성해 재사용)
  if (!VIGNETTE) {
    const v = c.createRadialGradient(W / 2, H * 0.4, H * 0.2, W / 2, H * 0.6, H * 0.8);
    v.addColorStop(0, 'transparent'); v.addColorStop(0.7, '#00000044'); v.addColorStop(1, '#000000aa');
    VIGNETTE = v;
  }
  c.fillStyle = VIGNETTE; c.fillRect(0, 0, W, H);
}

const mascot = { text: '', until: 0, mood: 'idle' };
function say(t, mood, ms) { mascot.text = t; mascot.mood = mood || 'idle'; mascot.until = performance.now() + (ms || 1800); }

function drawMascot(c, now) {
  const x = W - 30, y = 44 + Math.sin(now / 600) * 3, r = 19;
  const m = now < mascot.until ? mascot.mood : 'idle';
  c.save(); c.translate(x, y);

  // 입체 바디
  const Math_PI = Math.PI;
  const g = c.createRadialGradient(-r * 0.3, -r * 0.4, r * 0.1, 0, 0, r);
  g.addColorStop(0, '#fff3a8'); g.addColorStop(1, '#d49b00');
  c.fillStyle = g; c.beginPath(); c.arc(0, 0, r, 0, 7); c.fill();

  // 림라이트
  c.save(); c.globalCompositeOperation = 'source-atop';
  const rim = c.createRadialGradient(0, r * 0.2, r * 0.6, 0, 0, r);
  rim.addColorStop(0, 'transparent'); rim.addColorStop(1, '#ffffff88');
  c.fillStyle = rim; c.beginPath(); c.arc(0, 0, r, 0, 7); c.fill(); c.restore();

  // 하이라이트 & 테두리
  c.fillStyle = '#ffffff88'; c.beginPath(); c.ellipse(-r * 0.3, -r * 0.4, r * 0.25, r * 0.12, -0.6, 0, 7); c.fill();
  c.strokeStyle = '#00000033'; c.lineWidth = 1.5; c.beginPath(); c.arc(0, 0, r, 0, 7); c.stroke();

  // 별 더듬이
  c.fillStyle = '#ffe066'; c.save(); c.translate(0, -r - 6); c.rotate(Math.sin(now / 400) * 0.3);
  c.beginPath();
  for (let i = 0; i < 10; i++) { const rr = i % 2 ? 3 : 7, a = i / 10 * Math_PI * 2 - Math_PI / 2; c.lineTo(Math.cos(a) * rr, Math.sin(a) * rr); }
  c.closePath(); c.fill();
  c.fillStyle = '#ffffffaa'; c.beginPath(); c.arc(-1, -1, 1.5, 0, 7); c.fill(); // 더듬이 광택
  c.restore();

  // 표정 레이어 (입체감)
  c.save(); c.scale(1, 0.95);
  c.strokeStyle = '#2b1d3a'; c.fillStyle = '#2b1d3a'; c.lineWidth = 2; c.lineCap = 'round';
  const blink = Math.floor(now / 200) % 18 === 0;
  if (m === 'happy' || blink) {
    [-1, 1].forEach(s => { c.beginPath(); c.arc(s * 7, -2 + (blink && m !== 'happy' ? 2 : 0), 3, blink && m !== 'happy' ? 0 : Math_PI * 1.1, blink && m !== 'happy' ? Math_PI : Math_PI * 1.9); c.stroke(); });
  } else {
    [-1, 1].forEach(s => {
      c.beginPath(); c.arc(s * 7, -2, m === 'scared' ? 4 : 2.8, 0, 7); c.fill();
      c.fillStyle = '#fff'; c.beginPath(); c.arc(s * 7 + 1, -3, 1, 0, 7); c.fill(); c.fillStyle = '#2b1d3a';
    });
  }
  c.beginPath();
  if (m === 'scared') { c.arc(0, 8, 3, 0, 7); c.stroke(); }
  else if (m === 'sad') { c.arc(0, 10, 4, Math_PI * 1.15, Math_PI * 1.85); c.stroke(); }
  else { c.arc(0, 4, 5, 0.15 * Math_PI, 0.85 * Math_PI); c.stroke(); }
  c.restore(); // face scale
  c.restore(); // body

  // 말풍선
  if (now < mascot.until && mascot.text) {
    c.font = 'bold 12px sans-serif'; const w = c.measureText(mascot.text).width + 16, bx = x - r - 6 - w, by = y - 14;
    c.fillStyle = '#fffffff0'; c.beginPath(); c.roundRect(bx, by, w, 26, 10); c.fill();
    c.beginPath(); c.moveTo(bx + w, by + 8); c.lineTo(bx + w + 7, by + 13); c.lineTo(bx + w, by + 18); c.fill();
    c.fillStyle = '#2b1d3a'; c.textAlign = 'left'; c.textBaseline = 'middle'; c.fillText(mascot.text, bx + 8, by + 13);
  }
}

const cv=document.getElementById('c'),ctx=cv.getContext('2d');

let dpr=1,scale=1;

let engine,blobs,mode,rng,queue,curLevel,nextLevel,aimX,dropReady,score,over,combo,comboT,fx,usedRevive,bombMode,runMerged,maxLevel,t0,shakeT;
const $=id=>document.getElementById(id);

/* ───────── 스테이지 모드 ───────── */
// 스테이지마다 목표 점수가 있고, 그 스테이지에서 번 점수가 목표에 닿으면 클리어. 점수는 스테이지마다 0에서 시작
function stageTarget(n){return 150+100*(n-1)+15*(n-1)*(n-1)}
function seedStage(){ // 스테이지가 올라갈수록 바닥에 미리 깔린 몽글이가 늘어남(같은 스테이지는 항상 같은 배치)
  const cnt=Math.min(2*(stageNo-1),12);
  for(let i=0;i<cnt;i++){const l=(i+Math.floor(rng()*2))%4,r=RAD[l];addBlob(r+4+rng()*(W-2*r-8),H-90-i*14,l,1)}
}
function updateGoal(){
  const g=$('goal');g.classList.toggle('on',mode==='stage');if(mode!=='stage')return;
  $('goalTxt').textContent=`STAGE ${stageNo} · 목표 ${Math.min(score,goal.target)} / ${goal.target}점`;
  $('goalBar').style.width=Math.min(100,score/goal.target*100)+'%';
  const c=$('gc').getContext('2d');c.clearRect(0,0,56,56);c.fillStyle='#ffd166';c.beginPath();
  for(let i=0;i<10;i++){const r=i%2?10:24,a=i/10*Math.PI*2-Math.PI/2;c.lineTo(28+Math.cos(a)*r,30+Math.sin(a)*r)}c.closePath();c.fill();
}
function stageCheck(){ if(mode==='stage'&&!over&&score>=goal.target)clearStage() }
function clearStage(){
  over=true;cleared=true;
  runTotal+=score;
  const next=stageNo+1;if(next>store.get('stageNo',1))store.set('stageNo',next);
  if(runTotal>store.get('stageBestScore',0))store.set('stageBestScore',runTotal);
  let reward='';if(stageNo%3===0){S.items.shake++;S.items.bomb++;store.set('items',S.items);reward='<br>🎁 흔들기·폭파 아이템 +1 획득!'}
  say('클리어! 대단해요!','happy',9999);Music.setLevel(.6);vib([40,40,80]);
  [523,659,784,1047].forEach((f,i)=>tone(f,.3,'triangle',.15,i*.12));
  $('clearInfo').innerHTML=`<b style="font-size:22px;color:var(--acc)">STAGE ${stageNo} 클리어</b><br>이번 스테이지 ${score}점 (목표 ${goal.target}점)<br>누적 ${runTotal}점${reward}`;
  $('bNext').textContent=`STAGE ${next} ▶`;
  show('ovClear');
}
function startStage(fresh){
  if(fresh){stageNo=1;store.set('stageNo',1)}else stageNo=store.get('stageNo',1);
  runTotal=0;
  start('stage');
}
function pull(){return Math.floor(rng()*5*.999)} // 0~4 단계
function bestFor(){return mode==='daily'?store.get('daily_'+todayKey(),0):mode==='stage'?Math.max(store.get('stageBestScore',0),runTotal+score):S.best}

function addBlob(x,y,l,vy){
  const b=Bodies.circle(x,y,RAD[l],{restitution:.08,friction:.45,frictionStatic:.6,frictionAir:.012,slop:RAD[l]*.06,density:.001*Math.sqrt(RAD[l]/15),label:'blob'});
  b.lvl=l;b.born=performance.now();b.merging=false;b.k=0;b.kv=0;b.ka=0;b.s=1;b.sv=0;b.idle=0;
  if(vy)Body.setVelocity(b,{x:0,y:vy});
  World.add(engine.world,b);blobs.push(b);return b;
}
function squash(b,nx,ny,rv){const k=Math.min(.36,rv*.045);if(k<.03)return;if(k>b.k){b.k=k;b.kv=0;b.ka=Math.atan2(ny,nx)}}
let shake=0;
// 큰 몽글이가 떨어져 부딪히면 작은 몽글이를 크기(질량) 비율만큼 밀어낸다
function shove(a,b,rv){
  const big=a.lvl>b.lvl?a:b,sm=big===a?b:a,ratio=big.mass/(big.mass+sm.mass);
  let dx=sm.position.x-big.position.x,dy=sm.position.y-big.position.y;const d=Math.hypot(dx,dy)||1;dx/=d;dy/=d;
  if(Math.abs(dx)<.35)dx=(dx||Math.random()-.5)>0?.35:-.35; // 바로 아래면 옆으로 미끄러지게
  const p=Math.min(14,rv*ratio*1.8);
  Body.setVelocity(sm,{x:sm.velocity.x+dx*p*1.2,y:sm.velocity.y+Math.max(0,dy)*p*.5});
  Body.setVelocity(big,{x:big.velocity.x*.8-dx*p*.5*(1-ratio),y:big.velocity.y*.8}); // 큰 쪽은 감속하며 반대쪽으로 비껴 미끄러짐
  // 충격파: 주변 몽글이도 큰 몽글이 크기·속도에 비례해 밀려난다
  if(big.lvl>=3){const R=RAD[big.lvl]*2.4,cx=(big.position.x+sm.position.x)/2,cy=(big.position.y+sm.position.y)/2;
    for(const o of blobs){if(o===big||o===sm||o.merging)continue;
      let ox=o.position.x-cx,oy=o.position.y-cy;const od=Math.hypot(ox,oy)||1;if(od>R)continue;
      const f=Math.min(7,rv*.9*(big.mass/(big.mass+o.mass))*(1-od/R));
      Body.setVelocity(o,{x:o.velocity.x+ox/od*f,y:o.velocity.y+oy/od*f*.4});o.k=Math.max(o.k,Math.min(.25,f*.06));o.ka=Math.atan2(oy,ox)}}
  sm.k=Math.max(sm.k,Math.min(.35,p*.05));sm.ka=Math.atan2(dy,dx);
  if(big.lvl>=4&&rv>4){shake=Math.max(shake,Math.min(6,rv*big.lvl*.1))}
}
function removeBlob(b){World.remove(engine.world,b);const i=blobs.indexOf(b);if(i>=0)blobs.splice(i,1)}

function onCollide(ev){
  for(const p of ev.pairs){
    const a=p.bodyA,b=p.bodyB,n=p.collision.normal;
    const rv=Math.hypot(a.velocity.x-b.velocity.x,a.velocity.y-b.velocity.y);
    if(a.label==='blob')squash(a,n.x,n.y,rv);
    if(b.label==='blob')squash(b,n.x,n.y,rv);
    impact(a,b,rv,p.collision.supports&&p.collision.supports[0]);
    if(a.label!=='blob'||b.label!=='blob')continue;
    if(a.lvl!==b.lvl&&rv>1.5)shove(a,b,rv);
    if(a.lvl!==b.lvl||a.merging||b.merging)continue;
    a.merging=b.merging=true;
    // 합체 직전 서로 끌어당기는 쫀득한 연출
    {const dx=b.position.x-a.position.x,dy=b.position.y-a.position.y,d=Math.hypot(dx,dy)||1;
     Body.setVelocity(a,{x:dx/d*3,y:dy/d*3});Body.setVelocity(b,{x:-dx/d*3,y:-dy/d*3});
     a.sv+=.03;b.sv+=.03;}
    const l=a.lvl,x=(a.position.x+b.position.x)/2,y=(a.position.y+b.position.y)/2;
    setTimeout(()=>{ if(over)return;
      removeBlob(a);removeBlob(b);
      const now=performance.now();
      combo=(now-comboT<1100)?combo+1:1;comboT=now;runMerged++;
      if(l===N-1){ // 최종체 둘이 만나면 팡!
        score+=SCORE[l]*4;burst(x,y,l,40);sfxMerge(l,combo+4);vib([30,40,60]);
      }else{
        const nb=addBlob(x,y,l+1);nb.s=.55;nb.sv=.09;nb.k=.22;nb.ka=Math.random()*3;shake=Math.min(7,2+l*.7);
        score+=SCORE[l+1]*(1+Math.floor((combo-1)/2)*.5);
        if(l+1>maxLevel){maxLevel=l+1;unlock(l+1)}
        burst(x,y,l+1,10+l*3);sfxMerge(l+1,combo);vib(combo>2?[15,20,25]:12);
        // 주변 밀어내기
        for(const o of blobs){if(o===nb)continue;const dx=o.position.x-x,dy=o.position.y-y,d=Math.hypot(dx,dy)||1;
          if(d<RAD[l+1]*2.2){const f=.0006*o.mass*(1-d/(RAD[l+1]*2.2));Body.applyForce(o,o.position,{x:dx/d*f,y:dy/d*f})}}
      }
      if(combo>=3)say(['와아! 대박!','연쇄 폭발!','멋져요!'][combo%3],'happy',1400);
      if(combo>=2){const c=$('combo');c.className='';c.textContent=combo+' COMBO!';c.classList.add('show');clearTimeout(c._t);c._t=setTimeout(()=>c.classList.remove('show'),700)}
      score=Math.round(score);updateScore();stageCheck();
    },85);
  }
}
function burst(x,y,l,n){const c=THEMES[S.theme].levels[l][1];
  for(let i=0;i<n;i++){const a=Math.random()*7,s=1+Math.random()*3.5;fx.push({x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s-1,life:1,c,r:2+Math.random()*3})}}

function unlock(l){const k=S.theme;S.dex[k]=S.dex[k]||[];if(!S.dex[k].includes(l)){S.dex[k].push(l);store.set('dex',S.dex);toast('🎉 새 몽글이 발견: '+THEMES[k].levels[l][0]);say('새 친구다! '+THEMES[k].levels[l][0],'happy',2200)}}

function drawNext(){nctx.clearRect(0,0,88,88);if(nextLevel!=null)drawBlob(nctx,44,44,Math.min(RAD[nextLevel],38)*(38/RAD[4]>1?1:1),nextLevel)}
function useItem(kind){
  if(over||!engine)return;
  const go=()=>{
    if(kind==='shake'){
      for(const b of blobs)Body.setVelocity(b,{x:(Math.random()-.5)*10,y:-4-Math.random()*5});
      vib([30,30,30]);tone(120,.3,'sawtooth',.12);

  };
  if(S.items[kind]>0){ if(kind==='shake'){S.items.shake--;store.set('items',S.items)} go(); if(kind==='bomb'&&!bombMode){} }
  else Monet.rewarded(ok=>{if(ok){S.items[kind]++;store.set('items',S.items);refreshUI()}});
}

/* ───────── 입력 ───────── */
function pointerX(e){const r=cv.getBoundingClientRect();return(e.clientX-r.left)/scale}
let dragging=false;
cv.addEventListener('pointerdown',e=>{
  if(over||!engine)return;if(AC&&AC.state==='suspended')AC.resume();
  const x=pointerX(e),y=(e.clientY-cv.getBoundingClientRect().top)/scale;
  if(bombMode){
    const hit=blobs.find(b=>Math.hypot(b.position.x-x,b.position.y-y)<RAD[b.lvl]);
    if(hit){ if(S.items.bomb>0){S.items.bomb--;store.set('items',S.items)}
      burst(hit.position.x,hit.position.y,hit.lvl,24);removeBlob(hit);tone(90,.35,'sawtooth',.2);vib(60);bombMode=false;refreshUI()}
    return;
  }
  dragging=true;cv.setPointerCapture(e.pointerId);aimX=x;
});
cv.addEventListener('pointermove',e=>{if(dragging)aimX=pointerX(e)});
function release(){if(!dragging)return;dragging=false;drop()}
cv.addEventListener('pointerup',release);cv.addEventListener('pointercancel',release);

function drop(){
  if(!dropReady||over)return;
  const r=RAD[curLevel],x=Math.max(r+2,Math.min(W-r-2,aimX));
  addBlob(x,r+8,curLevel,2);sfxDrop();
  if(curLevel>maxLevel){maxLevel=curLevel;unlock(curLevel)}
  curLevel=nextLevel;nextLevel=pull();dropReady=false;drawNext();
  setTimeout(()=>{dropReady=true},550);
}

/* ───────── 게임오버 ───────── */
function checkOver(now){
  if(over)return;
  for(const b of blobs){
    if(now-b.born>1800&&b.position.y-RAD[b.lvl]<LINE&&Math.hypot(b.velocity.x,b.velocity.y)<1.2){
      b.overT=(b.overT||now);if(now-b.overT>1500)return end();
    }else b.overT=0;
  }
}
function end(){
  over=true;
  if(mode==='daily'){const k='daily_'+todayKey();if(score>store.get(k,0))store.set(k,score)}
  else if(mode==='stage'){const t=runTotal+score;if(t>store.get('stageBestScore',0))store.set('stageBestScore',t)}
  else if(score>S.best){S.best=score;store.set('best',score)}
  vib([80,40,80]);tone(150,.6,'sawtooth',.15);say('괜찮아, 다시 해봐요!','sad',9999);Music.setLevel(.3);
  $('overInfo').innerHTML=`<span class="tag">${mode==='daily'?'📅 '+todayKey():mode==='stage'?'🏁 STAGE '+stageNo+' 실패':'일반'}</span><br><b style="font-size:30px;color:var(--acc)">${score}</b> 점${mode==='stage'?` / 목표 ${goal.target}점`:''}<br>최고 단계: ${THEMES[S.theme].levels[maxLevel][0]} · 합체 ${runMerged}회`;
  $('bRevive').style.display=usedRevive?'none':'';$('bRetry').textContent=mode==='stage'?'이 스테이지 다시 도전':'다시 하기';
  show('ovOver');updateScore();
}
function revive(){
  // 위쪽 3분의 1에 걸친 몽글이를 비운다
  blobs.filter(b=>b.position.y-RAD[b.lvl]<LINE+60).forEach(b=>{burst(b.position.x,b.position.y,b.lvl,12);removeBlob(b)});
  usedRevive=true;over=false;hide('ovOver');Music.setLevel(1);
  blobs.forEach(b=>{b.overT=0;b.born=performance.now()});say('휴, 살았다!','happy',1800);
}

/* ───────── 메인 루프 ───────── */
let last=performance.now(),acc=0;
function frame(now){
  requestAnimationFrame(frame);
  if(!engine)return;
  const dt=Math.min(now-last,50);last=now;
  if(!LOWFX){ fEma=fEma*.97+dt*.03; if(fEma>20.5)slowFrames++; else slowFrames=0; if(slowFrames>150)LOWFX=true } // 평균 프레임이 약 3초간 49fps 미만이면 저사양 모드
  if(!over){acc+=dt;while(acc>=1000/120){Engine.update(engine,1000/120);acc-=1000/120}}
  if(combo&&now-comboT>1200)combo=0;
  checkOver(now);
  render(now);
}
function render(now){
  ctx.setTransform(scale*dpr,0,0,scale*dpr,0,0);const _th=THEMES[S.theme];drawScene(ctx,now,_th,S.theme);drawMascot(ctx,now);
  shake*=.86;if(shake>.2)ctx.translate((Math.random()-.5)*shake,(Math.random()-.5)*shake);
  // 위험선
  const warn=blobs.some(b=>b.overT);if(warn&&now>mascot.until)say('앗, 위험해요!','scared',1000);
  ctx.setLineDash([8,8]);ctx.strokeStyle=warn?'#ff5470':'#ffffff44';ctx.lineWidth=warn&&Math.floor(now/200)%2?3:2;
  ctx.beginPath();ctx.moveTo(0,LINE);ctx.lineTo(W,LINE);ctx.stroke();ctx.setLineDash([]);
  // 조준
  if(!over&&dropReady&&!bombMode){
    const r=RAD[curLevel],x=Math.max(r+2,Math.min(W-r-2,aimX));
    ctx.strokeStyle='#ffffff30';ctx.setLineDash([4,6]);ctx.beginPath();ctx.moveTo(x,r*2+10);ctx.lineTo(x,H);ctx.stroke();ctx.setLineDash([]);
    const hk=Math.sin(now/350)*.05;drawBlob(ctx,x,r+8+hk*r,r,curLevel,{k:hk,ka:Math.PI/2,happy:(now%4200)<160});
  }else if(!over&&!bombMode){const r=RAD[curLevel];ctx.globalAlpha=.35;drawBlob(ctx,Math.max(r+2,Math.min(W-r-2,aimX)),r+8,r,curLevel,{});ctx.globalAlpha=1}
  drawBlobShadows(ctx,blobs); // 바닥 접촉 그림자(몽글이 아래에 먼저 그림)
  for(const b of blobs){
    b.kv+=-.22*b.k-.1*b.kv;b.k+=b.kv;if(Math.abs(b.k)<.001&&Math.abs(b.kv)<.001)b.k=b.kv=0;
    b.sv+=-.18*(b.s-1)-.12*b.sv;b.s+=b.sv;
    const sp=Math.hypot(b.velocity.x,b.velocity.y),near=sp>2,R=RAD[b.lvl];
    // 대기 애니메이션(화면 전용, 물리 영향 없음): 가만히 있을 때만 천천히 켜지고, 움직이거나 부딪히면 부드럽게 꺼짐
    const calm=sp<.8&&b.k<.03&&!b.merging&&now-b.born>600;
    b.idle+=((calm?1:0)-b.idle)*.06;
    const ik=Math.sin(now/430+b.id*1.7)*.05*b.idle;               // 위아래로 말랑하게 숨쉬기
    const ia=Math.sin(now/1300+b.id)*.035*b.idle;                  // 살짝 좌우로 기우뚱
    const smile=b.idle>.5&&((now+b.id*977)%4200<160||Math.sin((now+b.id*531)/1700)>.93); // 눈 깜빡임/웃음
    const phys=b.k>.02;                                            // 충돌 찌그러짐이 있으면 그 방향을 우선
    drawBlob(ctx,b.position.x,b.position.y+ik*R,R,b.lvl,{a:b.angle+ia,k:b.k+ik,ka:phys?b.ka:Math.PI/2,s:b.s,happy:Math.abs(b.k)>.06||near&&b.lvl>3||smile});
    if(bombMode){ctx.strokeStyle='#ff547088';ctx.lineWidth=2;ctx.beginPath();ctx.arc(b.position.x,b.position.y,RAD[b.lvl]+3,0,7);ctx.stroke()}
  }
  for(let i=fx.length-1;i>=0;i--){const p=fx[i];p.x+=p.vx;p.y+=p.vy;p.vy+=.12;p.life-=.025;
    if(p.life<=0){fx.splice(i,1);continue}
    ctx.globalAlpha=p.life;ctx.fillStyle=p.c;ctx.beginPath();ctx.arc(p.x,p.y,p.r*p.life,0,7);ctx.fill();ctx.globalAlpha=1}
}

$('bMenu').onclick=()=>{refreshUI();show('ovMenu')};$('mClose').onclick=()=>hide('ovMenu');
$('mSound').onclick=()=>{S.sound=!S.sound;store.set('sound',S.sound);refreshUI()};

$('mRestart').onclick=()=>start(mode||'normal');
$('bRetry').onclick=()=>start(mode);
$('bHome').onclick=()=>{hide('ovOver');refreshUI();show('ovStart')};
$('bRevive').onclick=()=>Monet.rewarded(ok=>{if(ok)revive()});
$('bShare').onclick=()=>{
  const t=`🫧 Blob Drop ${mode==='daily'?todayKey()+' 데일리':''} ${score}점 · 최고 단계 ${THEMES[S.theme].levels[maxLevel][0]}\n${location.href.split('?')[0]}`;
  if(navigator.share)navigator.share({text:t}).catch(()=>{});
  else if(navigator.clipboard)navigator.clipboard.writeText(t).then(()=>alert('복사되었습니다!'));
};
function openTheme(){
  const box=$('themeList');box.innerHTML='';
  Object.keys(THEMES).forEach(k=>{
    const b=document.createElement('button');b.style.cssText='display:block;width:100%;margin:6px 0';
    b.textContent=(k===S.theme?'✅ ':'')+THEMES[k].name+' ('+((S.dex[k]||[]).length)+'/'+N+')';
    b.onclick=()=>{S.theme=k;store.set('theme',k);hide('ovTheme');if(Music.on)Music.start(k);refreshUI()};
    box.appendChild(b)});
  show('ovTheme');
}

resize();newGame('normal');refreshUI();requestAnimationFrame(frame);
