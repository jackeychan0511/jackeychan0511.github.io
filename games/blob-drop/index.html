<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#1b1535">
<title>Blob Drop — 몽글몽글 합체 퍼즐</title>
<meta name="description" content="같은 몽글이를 떨어뜨려 합치고 진화시키는 물리 머지 퍼즐. 데일리 챌린지와 도감 수집.">
<style>
:root{--bg:#1b1535;--panel:#2a2250;--ink:#fff;--sub:#b9b0e6;--acc:#ffd166;--acc2:#ff7eb6}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none}
html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);font-family:-apple-system,"Apple SD Gothic Neo","Noto Sans KR",sans-serif;overflow:hidden;touch-action:none}
#app{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;padding:env(safe-area-inset-top) 8px env(safe-area-inset-bottom)}
#hud{width:100%;max-width:440px;display:flex;align-items:center;justify-content:space-between;padding:8px 4px;gap:8px}
.stat{background:var(--panel);border-radius:12px;padding:4px 12px;min-width:76px;text-align:center}
.stat small{display:block;font-size:10px;color:var(--sub)}
.stat b{font-size:18px}
#next{display:flex;align-items:center;gap:6px}
#next canvas{width:44px;height:44px;background:var(--panel);border-radius:50%}
#stage{position:relative;flex:1;width:100%;max-width:440px;min-height:0}
#c{position:absolute;left:50%;top:0;transform:translateX(-50%);border-radius:14px;background:linear-gradient(#2d2560,#211a47)}
#combo{position:absolute;left:0;right:0;top:12%;text-align:center;font-size:34px;font-weight:900;color:var(--acc);text-shadow:0 3px 0 #0006;pointer-events:none;opacity:0;transition:opacity .2s,transform .2s}
#combo.sm{font-size:18px;padding:0 20px;top:22%}
#combo.show{opacity:1;transform:scale(1.15)}
#bar{width:100%;max-width:440px;display:flex;gap:6px;padding:8px 0}
button{font:inherit;color:var(--ink);background:var(--panel);border:0;border-radius:12px;padding:10px 6px;flex:1;font-weight:700;font-size:13px;cursor:pointer}
button:active{transform:scale(.96)}
button.hot{background:var(--acc2)}
button small{display:block;font-weight:400;font-size:10px;color:var(--sub)}
.ov{position:fixed;inset:0;background:#000b;display:none;align-items:center;justify-content:center;z-index:5;padding:16px}
.ov.on{display:flex}
.card{background:var(--panel);border-radius:20px;padding:20px;width:100%;max-width:400px;max-height:90vh;overflow:auto;text-align:center}
.card h2{margin:0 0 4px}.card p{color:var(--sub);font-size:13px;margin:6px 0 12px}
.card .row{display:flex;gap:8px;margin-top:8px}
.card button.big{padding:14px;font-size:16px;background:var(--acc);color:#2a1a00}
#dex{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin:10px 0}
#dex div{font-size:11px;color:var(--sub)}#dex canvas{width:100%;aspect-ratio:1}
#dex .lock canvas{filter:brightness(0) opacity(.35)}
.tag{display:inline-block;background:#0004;border-radius:99px;padding:2px 10px;font-size:11px;color:var(--acc)}
</style>
</head>
<body>
<div id="app">
  <div id="hud">
    <div class="stat"><small>SCORE</small><b id="score">0</b></div>
    <div id="next"><span style="font-size:11px;color:var(--sub)">NEXT</span><canvas id="nc" width="88" height="88"></canvas></div>
    <div class="stat"><small id="bestl">BEST</small><b id="best">0</b></div>
  </div>
  <div id="stage"><canvas id="c"></canvas><div id="combo"></div></div>
  <div id="bar">
    <button id="bShake">🌀 흔들기<small id="nShake"></small></button>
    <button id="bBomb">💥 폭파<small id="nBomb"></small></button>
    <button id="bDex">📖 도감</button>
    <button id="bMenu">⚙️ 메뉴</button>
  </div>
</div>

<div class="ov on" id="ovStart"><div class="card">
  <h2>🫧 Blob Drop</h2>

  <div class="row"><button class="big" id="goDaily" style="background:var(--acc2);color:#fff">🌠 오늘의 별똥<small id="dailyInfo"></small></button></div>
  <div class="row"><button id="goDex">📖 도감</button><button id="goTheme">🎨 테마</button></div>
</div></div>

<div class="ov" id="ovOver"><div class="card">
  <h2>상자가 넘쳤어요!</h2>
  <p id="overInfo"></p>
  <div class="row"><button class="big" id="bRevive">📺 광고 보고 한 칸 비우기<small>(이어하기 1회)</small></button></div>
  <div class="row"><button id="bShare">📋 결과 공유</button><button id="bRetry">다시 하기</button></div>
  <div class="row"><button id="bHome">처음으로</button></div>

<div class="ov" id="ovDex"><div class="card">

  <button id="themeClose" style="margin-top:10px">닫기</button>

<div class="ov" id="ovMenu"><div class="card">

  <div class="row"><button id="mMusic"></button><button id="mSound"></button></div>
  <div class="row"><button id="mVib"></button></div>

  <div class="row"><button id="mRestart">다시 시작</button><button id="mClose">닫기</button></div>

/* ───────── 시드 난수 (데일리 챌린지) ───────── */
function mulberry(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
function todayKey(){const d=new Date(Date.now()+9*3600e3);return d.toISOString().slice(0,10)}
function dateSeed(k){return +k.replace(/-/g,'')}

let AC=null;
function tone(f,d,type,vol,when){ if(!S.sound)return;
  try{AC=AC||new (window.AudioContext||window.webkitAudioContext)();
    const t=AC.currentTime+(when||0),o=AC.createOscillator(),g=AC.createGain();
    o.type=type||'sine';o.frequency.setValueAtTime(f,t);o.frequency.exponentialRampToValueAtTime(f*1.5,t+d*.6);
    g.gain.setValueAtTime(vol||.15,t);g.gain.exponentialRampToValueAtTime(.001,t+d);
    o.connect(g);g.connect(AC.destination);o.start(t);o.stop(t+d)}catch(e){}}

/* ───────── BGM (테마별 실시간 합성, 음원 파일 없음) ───────── */
function getAC(){AC=AC||new (window.AudioContext||window.webkitAudioContext)();return AC}
const mf=m=>440*Math.pow(2,(m-69)/12);
const SONGS={
  jelly:{bpm:84,chords:[[60,64,67],[57,60,64],[53,57,60],[55,59,62]],arp:'sine',pad:'triangle',pat:[0,1,2,1,2,1,2,1],tick:0},
  space:{bpm:70,chords:[[62,65,69],[58,62,65],[53,57,60],[60,64,67]],arp:'sine',pad:'sawtooth',pat:[0,2,1,2,0,2,1,2],tick:0,echo:.45},
  food:{bpm:116,chords:[[65,69,72],[62,65,69],[58,62,65],[60,64,67]],arp:'triangle',pad:'sine',pat:[0,2,1,2,0,2,1,2],tick:1,stac:1},
  winter:{bpm:76,chords:[[57,60,64],[53,57,60],[60,64,67],[55,59,62]],arp:'sine',pad:'triangle',pat:[2,1,0,1,2,1,0,1],tick:0,bell:1,echo:.4},
  spring:{bpm:98,chords:[[67,71,74],[64,67,71],[60,64,67],[62,66,69]],arp:'triangle',pad:'sine',pat:[0,1,2,1,0,2,1,2],tick:1},
  halloween:{bpm:100,chords:[[64,67,71],[60,64,67],[59,63,66],[64,67,71]],arp:'sawtooth',pad:'sawtooth',pat:[0,2,1,2,0,1,2,1],tick:1,dark:1}
};
const Music={on:false,step:0,next:0,timer:null,master:null,out:null,cfg:null,key:null,level:1,
  start(k){
    this.stop();if(!S.music)return;
    try{const ac=getAC();if(ac.state==='suspended')ac.resume();
      this.key=k;this.cfg=SONGS[k]||SONGS.jelly;
      this.master=ac.createGain();this.master.gain.value=0;this.master.connect(ac.destination);
      this.master.gain.setTargetAtTime(.5*this.level,ac.currentTime,.6);
      const dl=ac.createDelay(1);dl.delayTime.value=60/this.cfg.bpm*.75;const fb=ac.createGain();fb.gain.value=this.cfg.echo||.28;
      const lp=ac.createBiquadFilter();lp.type='lowpass';lp.frequency.value=2400;
      dl.connect(lp);lp.connect(fb);fb.connect(dl);lp.connect(this.master);this.echo=dl;
      this.step=0;this.next=ac.currentTime+.15;this.on=true;
      this.timer=setInterval(()=>this.tick(),30);
    }catch(e){this.on=false}
  },
  stop(){
    clearInterval(this.timer);this.on=false;
    if(this.master){const m=this.master,ac=AC;try{m.gain.setTargetAtTime(0,ac.currentTime,.15);setTimeout(()=>{try{m.disconnect()}catch(e){}},900)}catch(e){}this.master=null}
  },
  setLevel(v){this.level=v;if(this.master&&AC)this.master.gain.setTargetAtTime(.5*v,AC.currentTime,.4)},
  tick(){
    const ac=AC;if(!ac||!this.on)return;
    const dur=60/this.cfg.bpm/2;
    while(this.next<ac.currentTime+.25){this.play(this.step,this.next,dur);this.next+=dur;this.step++}
  },
  voice(f,t,d,type,v,dest,att,cut){
    const ac=AC,o=ac.createOscillator(),g=ac.createGain();o.type=type;o.frequency.value=f;
    g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(v,t+(att||.01));g.gain.exponentialRampToValueAtTime(.0008,t+d);
    let n=o;if(cut){const fl=ac.createBiquadFilter();fl.type='lowpass';fl.frequency.value=cut;o.connect(fl);n=fl}
    n.connect(g);g.connect(dest||this.master);if(dest!==this.echo&&this.cfg.echo&&type===this.cfg.arp&&!cut)g.connect(this.echo);
    o.start(t);o.stop(t+d+.05);
  },
  play(step,t,dur){
    const c=this.cfg,bar=Math.floor(step/8)%c.chords.length,s=step%8,ch=c.chords[bar];
    if(s===0){ // 패드
      ch.forEach((m,i)=>this.voice(mf(m-12+(i?0:0)),t,dur*8,c.pad,.05,null,dur*2,c.dark?500:900));
      this.voice(mf(ch[0]-24),t,dur*4,'sine',.2,null,.02);
    }
    if(s===4)this.voice(mf(ch[0]-24+(c.stac?7:0)),t,dur*3,'sine',.16,null,.02);
    // 아르페지오
    const idx=c.pat[s],oct=(bar%2&&s>3)?12:0,m=ch[idx]+(c.bell?12:0)+oct;
    const d=c.stac?dur*.5:c.bell?dur*3:dur*1.8;
    this.voice(mf(m),t,d,c.arp,c.bell?.07:.09,null,.008,c.dark?1400:0);
    if(c.tick&&s%2===1){ // 가벼운 틱
      const ac=AC,b=ac.createBuffer(1,2205,ac.sampleRate),dd=b.getChannelData(0);for(let i=0;i<dd.length;i++)dd[i]=(Math.random()*2-1)*(1-i/dd.length);
      const src=ac.createBufferSource();src.buffer=b;const hp=ac.createBiquadFilter();hp.type='highpass';hp.frequency.value=6000;const g=ac.createGain();g.gain.value=.06;src.connect(hp);hp.connect(g);g.connect(this.master);src.start(t)}
    // 멜로디 포인트 (2마디마다 위로 올라가는 짧은 장식음)
    if(s===6&&bar%2===1)this.voice(mf(ch[2]+12),t,dur*2.5,c.bell?'sine':c.arp,.06,null,.01,c.dark?1400:0);
  }
};
document.addEventListener('visibilitychange',()=>{if(!AC)return;document.hidden?AC.suspend():AC.resume()});
document.addEventListener('pointerdown',()=>{if(S.music&&!Music.on)Music.start(S.theme);else if(AC&&AC.state==='suspended')AC.resume()});
function sfxMerge(l,combo){const base=261.6*Math.pow(2,(l*2+Math.min(combo,6))/12);tone(base,.25,'triangle',.18);tone(base*1.5,.2,'sine',.08,.05)}
function sfxDrop(){tone(180,.12,'sine',.12)}
function vib(p){if(S.vib&&navigator.vibrate)try{navigator.vibrate(p)}catch(e){}}

/* ───────── 몽글이 그리기 ───────── */
function drawBlob(ctx,x,y,r,l,o){
  o=o||{};const th=THEMES[S.theme].levels[l];
  const k=o.k||0,sc=o.s==null?1:o.s;
  ctx.save();ctx.translate(x,y);ctx.scale(sc,sc);
  if(k){ctx.rotate(o.ka||0);ctx.scale(1-k,1+k*.9);ctx.rotate(-(o.ka||0))}
  ctx.rotate(o.a||0);
  const g=ctx.createRadialGradient(-r*.35,-r*.4,r*.1,0,0,r);
  g.addColorStop(0,th[1]);g.addColorStop(1,th[2]);
  ctx.fillStyle=g;ctx.beginPath();ctx.arc(0,0,r,0,7);ctx.fill();
  ctx.strokeStyle='#0003';ctx.lineWidth=Math.max(1.5,r*.05);ctx.stroke();
  // 하이라이트
  ctx.fillStyle='#fff6';ctx.beginPath();ctx.ellipse(-r*.4,-r*.5,r*.22,r*.12,-.6,0,7);ctx.fill();
  // 눈
  const ex=r*.32,ey=-r*.05,er=Math.max(2,r*.13);
  ctx.fillStyle='#2b1d3a';
  const happy=o.happy;
  if(happy){ctx.lineWidth=Math.max(1.5,r*.07);ctx.strokeStyle='#2b1d3a';ctx.lineCap='round';
    [-1,1].forEach(s=>{ctx.beginPath();ctx.arc(s*ex,ey+er*.4,er,Math.PI*1.1,Math.PI*1.9);ctx.stroke()})}
  else [-1,1].forEach(s=>{ctx.beginPath();ctx.arc(s*ex,ey,er,0,7);ctx.fill();
    ctx.fillStyle='#fff';ctx.beginPath();ctx.arc(s*ex+er*.3,ey-er*.3,er*.35,0,7);ctx.fill();ctx.fillStyle='#2b1d3a'});
  // 볼터치·입
  ctx.fillStyle='#ff6b9d55';[-1,1].forEach(s=>{ctx.beginPath();ctx.ellipse(s*r*.55,r*.2,r*.12,r*.08,0,0,7);ctx.fill()});
  ctx.strokeStyle='#2b1d3a';ctx.lineWidth=Math.max(1.5,r*.06);ctx.lineCap='round';
  ctx.beginPath();ctx.arc(0,r*.18,r*.14,.15*Math.PI,.85*Math.PI);ctx.stroke();
  // 배지
  if(th[3]!=='·'&&r>=26){ctx.font=Math.round(r*.4)+'px serif';ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillText(th[3],0,-r*.68)}
  ctx.restore();
}


/* ───────── 배경 장면 (이미지 파일 없이 코드로 그림 · 테마별 교체) ───────── */
const STARS=Array.from({length:70},(_,i)=>({x:(i*97%360),y:(i*53%420),r:.6+(i%4)*.45,p:i*.7}));
function fall(c,now,col,n,size,speed,petal){
  c.fillStyle=col;
  for(let i=0;i<n;i++){const x=((i*71)%W+Math.sin(now/900+i)*18+W)%W,y=(i*131+now*speed*.05*(1+(i%3)*.4))%(H+20)-10,r=size*(.1+(i%4)*.05);
    c.beginPath();if(petal)c.ellipse(x,y,r*1.4,r*.8,now/700+i,0,7);else c.arc(x,y,Math.max(1,r*.3),0,7);c.fill()}
}
/* ── 배경 도구 ── */
function glow(c,x,y,r,col){const g=c.createRadialGradient(x,y,0,x,y,r);g.addColorStop(0,col);g.addColorStop(1,'#0000');c.fillStyle=g;c.fillRect(x-r,y-r,r*2,r*2)}
function sky(c,stops){const g=c.createLinearGradient(0,0,0,H);stops.forEach((s,i)=>g.addColorStop(i/(stops.length-1),s));c.fillStyle=g;c.fillRect(0,0,W,H)}
function hills(c,y,amp,col,seed,fr){c.fillStyle=col;c.beginPath();c.moveTo(0,H);for(let x=0;x<=W;x+=6)c.lineTo(x,y+Math.sin(x*fr+seed)*amp+Math.sin(x*fr*2.3+seed*2)*amp*.4);c.lineTo(W,H);c.fill()}
function pine(c,x,y,h,col){c.fillStyle=col;for(let i=0;i<4;i++){const w=h*.28*(1-i*.17),ty=y-h*(.25+i*.2);c.beginPath();c.moveTo(x-w,ty+h*.22);c.lineTo(x,ty-h*.12);c.lineTo(x+w,ty+h*.22);c.fill()}c.fillRect(x-h*.03,y-h*.1,h*.06,h*.12)}
function house(c,x,y,w,h,col,win){c.fillStyle=col;c.fillRect(x,y-h,w,h);c.beginPath();c.moveTo(x-4,y-h);c.lineTo(x+w/2,y-h-w*.5);c.lineTo(x+w+4,y-h);c.fill();
  c.fillStyle=win;[[.2,.35],[.6,.35],[.4,.7]].forEach(p=>c.fillRect(x+w*p[0],y-h*p[1]-6,w*.16,w*.2))}
function sparkle(c,x,y,r,a){c.globalAlpha=a;c.strokeStyle='#fff';c.lineWidth=1;c.beginPath();c.moveTo(x-r,y);c.lineTo(x+r,y);c.moveTo(x,y-r);c.lineTo(x,y+r);c.stroke();c.globalAlpha=1}
function fireflies(c,now,n,col){for(let i=0;i<n;i++){const x=(i*83%W)+Math.sin(now/1300+i*2)*22,y=H*.45+(i*47%(H*.5))+Math.cos(now/1100+i)*16,a=.35+.65*Math.abs(Math.sin(now/600+i*1.7));glow(c,x,y,10,col.replace('A',a.toFixed(2)));c.fillStyle='#fff';c.globalAlpha=a;c.fillRect(x-1,y-1,2,2);c.globalAlpha=1}}
function clouds(c,now,col,n,yMin,yMax,sp){c.fillStyle=col;for(let i=0;i<n;i++){const w=60+(i%3)*30,x=((i*130+now*sp*(1+i%2*.5))%(W+w*2))-w,y=yMin+(i*61%(yMax-yMin));
  c.beginPath();c.ellipse(x,y,w*.5,10,0,0,7);c.ellipse(x+w*.25,y-7,w*.28,11,0,0,7);c.ellipse(x-w*.2,y-4,w*.25,9,0,0,7);c.fill()}}

function addBlob(x,y,l,vy){
  const b=Bodies.circle(x,y,RAD[l],{restitution:.08,friction:.45,frictionStatic:.6,frictionAir:.012,slop:RAD[l]*.06,density:.001*Math.sqrt(RAD[l]/15),label:'blob'});
  b.lvl=l;b.born=performance.now();b.merging=false;b.k=0;b.kv=0;b.ka=0;b.s=1;b.sv=0;
  if(vy)Body.setVelocity(b,{x:0,y:vy});
  World.add(engine.world,b);blobs.push(b);return b;
}
function squash(b,nx,ny,rv){const k=Math.min(.3,rv*.035);if(k<.03)return;if(k>b.k){b.k=k;b.kv=0;b.ka=Math.atan2(ny,nx)}}
let shake=0;
// 큰 몽글이가 떨어져 부딪히면 작은 몽글이를 크기(질량) 비율만큼 밀어낸다
function shove(a,b,rv){
  const big=a.lvl>b.lvl?a:b,sm=big===a?b:a,ratio=big.mass/(big.mass+sm.mass);
  let dx=sm.position.x-big.position.x,dy=sm.position.y-big.position.y;const d=Math.hypot(dx,dy)||1;dx/=d;dy/=d;
  if(Math.abs(dx)<.35)dx=(dx||Math.random()-.5)>0?.35:-.35; // 바로 아래면 옆으로 미끄러지게
  const p=Math.min(14,rv*ratio*1.8);
  Body.setVelocity(sm,{x:sm.velocity.x+dx*p*1.2,y:sm.velocity.y+Math.max(0,dy)*p*.5});
  Body.setVelocity(big,{x:big.velocity.x*.8-dx*p*.5*(1-ratio),y:big.velocity.y*.8}); // 큰 쪽은 감속하며 반대쪽으로 비껴 미끄러짐
  // 충격파: 주변 몽글이도 큰 몽글이 크기·속도에 비례해 밀려난다
  if(big.lvl>=3){const R=RAD[big.lvl]*2.4,cx=(big.position.x+sm.position.x)/2,cy=(big.position.y+sm.position.y)/2;
    for(const o of blobs){if(o===big||o===sm||o.merging)continue;
      let ox=o.position.x-cx,oy=o.position.y-cy;const od=Math.hypot(ox,oy)||1;if(od>R)continue;
      const f=Math.min(7,rv*.9*(big.mass/(big.mass+o.mass))*(1-od/R));
      Body.setVelocity(o,{x:o.velocity.x+ox/od*f,y:o.velocity.y+oy/od*f*.4});o.k=Math.max(o.k,Math.min(.25,f*.06));o.ka=Math.atan2(oy,ox)}}
  sm.k=Math.max(sm.k,Math.min(.35,p*.05));sm.ka=Math.atan2(dy,dx);
  if(big.lvl>=4&&rv>4){shake=Math.max(shake,Math.min(6,rv*big.lvl*.1));vib(Math.min(40,10+big.lvl*3));tone(110-big.lvl*4,.18,'sine',.1)}
}
function removeBlob(b){World.remove(engine.world,b);const i=blobs.indexOf(b);if(i>=0)blobs.splice(i,1)}

function onCollide(ev){
  for(const p of ev.pairs){
    const a=p.bodyA,b=p.bodyB,n=p.collision.normal;
    const rv=Math.hypot(a.velocity.x-b.velocity.x,a.velocity.y-b.velocity.y);
    if(a.label==='blob')squash(a,n.x,n.y,rv);
    if(b.label==='blob')squash(b,n.x,n.y,rv);
    if(rv>3&&a.label==='blob'&&b.label==='blob')tone(200+Math.random()*60,.08,'sine',Math.min(.1,rv*.01));
    if(a.label!=='blob'||b.label!=='blob')continue;
    if(a.lvl!==b.lvl&&rv>1.5)shove(a,b,rv);
    if(a.lvl!==b.lvl||a.merging||b.merging)continue;
    a.merging=b.merging=true;
    // 합체 직전 서로 끌어당기는 쫀득한 연출
    {const dx=b.position.x-a.position.x,dy=b.position.y-a.position.y,d=Math.hypot(dx,dy)||1;
     Body.setVelocity(a,{x:dx/d*3,y:dy/d*3});Body.setVelocity(b,{x:-dx/d*3,y:-dy/d*3});
     a.sv+=.03;b.sv+=.03;}
    const l=a.lvl,x=(a.position.x+b.position.x)/2,y=(a.position.y+b.position.y)/2;
    setTimeout(()=>{ if(over)return;
      removeBlob(a);removeBlob(b);
      const now=performance.now();
      combo=(now-comboT<1100)?combo+1:1;comboT=now;runMerged++;
      if(l===N-1){ // 최종체 둘이 만나면 팡!
        score+=SCORE[l]*4;burst(x,y,l,40);sfxMerge(l,combo+4);vib([30,40,60]);
      }else{
        const nb=addBlob(x,y,l+1);nb.s=.55;nb.sv=.09;nb.k=.22;nb.ka=Math.random()*3;shake=Math.min(7,2+l*.7);
        score+=SCORE[l+1]*(1+Math.floor((combo-1)/2)*.5);
        if(l+1>maxLevel){maxLevel=l+1;unlock(l+1)}
        burst(x,y,l+1,10+l*3);sfxMerge(l+1,combo);vib(combo>2?[15,20,25]:12);
        // 주변 밀어내기
        for(const o of blobs){if(o===nb)continue;const dx=o.position.x-x,dy=o.position.y-y,d=Math.hypot(dx,dy)||1;
          if(d<RAD[l+1]*2.2){const f=.0006*o.mass*(1-d/(RAD[l+1]*2.2));Body.applyForce(o,o.position,{x:dx/d*f,y:dy/d*f})}}
      }
      if(combo>=3)say(['와아! 대박!','연쇄 폭발!','멋져요!'][combo%3],'happy',1400);
      if(combo>=2){const c=$('combo');c.className='';c.textContent=combo+' COMBO!';c.classList.add('show');clearTimeout(c._t);c._t=setTimeout(()=>c.classList.remove('show'),700)}
      score=Math.round(score);updateScore();
    },85);
  }
}

  if(over||!engine)return;if(AC&&AC.state==='suspended')AC.resume();

  for(const b of blobs){
    if(now-b.born>1800&&b.position.y-RAD[b.lvl]<LINE&&Math.hypot(b.velocity.x,b.velocity.y)<1.2){
      b.overT=(b.overT||now);if(now-b.overT>1500)return end();
    }else b.overT=0;
  }
}
function end(){
  over=true;
  if(mode==='daily'){const k='daily_'+todayKey();if(score>store.get(k,0))store.set(k,score)}
  else if(score>S.best){S.best=score;store.set('best',score)}
  vib([80,40,80]);tone(150,.6,'sawtooth',.15);say('괜찮아, 다시 해봐요!','sad',9999);Music.setLevel(.3);
  $('overInfo').innerHTML=`<span class="tag">${mode==='daily'?'📅 '+todayKey():'일반'}</span><br><b style="font-size:30px;color:var(--acc)">${score}</b> 점<br>최고 단계: ${THEMES[S.theme].levels[maxLevel][0]} · 합체 ${runMerged}회`;
  $('bRevive').style.display=usedRevive?'none':'';
  show('ovOver');updateScore();
}
function revive(){
  // 위쪽 3분의 1에 걸친 몽글이를 비운다
  blobs.filter(b=>b.position.y-RAD[b.lvl]<LINE+60).forEach(b=>{burst(b.position.x,b.position.y,b.lvl,12);removeBlob(b)});
  usedRevive=true;over=false;hide('ovOver');Music.setLevel(1);
  blobs.forEach(b=>{b.overT=0;b.born=performance.now()});say('휴, 살았다!','happy',1800);
}

/* ───────── 메인 루프 ───────── */
let last=performance.now(),acc=0;
function frame(now){
  requestAnimationFrame(frame);
  if(!engine)return;
  const dt=Math.min(now-last,50);last=now;
  if(!over){acc+=dt;while(acc>=1000/120){Engine.update(engine,1000/120);acc-=1000/120}}
  if(combo&&now-comboT>1200)combo=0;
  checkOver(now);
  render(now);
}
function render(now){
  ctx.setTransform(scale*dpr,0,0,scale*dpr,0,0);const _th=THEMES[S.theme];drawScene(ctx,now,_th,S.theme);drawMascot(ctx,now);
  shake*=.86;if(shake>.2)ctx.translate((Math.random()-.5)*shake,(Math.random()-.5)*shake);
  // 위험선
  const warn=blobs.some(b=>b.overT);if(warn&&now>mascot.until)say('앗, 위험해요!','scared',1000);
  ctx.setLineDash([8,8]);ctx.strokeStyle=warn?'#ff5470':'#ffffff44';ctx.lineWidth=warn&&Math.floor(now/200)%2?3:2;
  ctx.beginPath();ctx.moveTo(0,LINE);ctx.lineTo(W,LINE);ctx.stroke();ctx.setLineDash([]);
  // 조준
  if(!over&&dropReady&&!bombMode){
    const r=RAD[curLevel],x=Math.max(r+2,Math.min(W-r-2,aimX));
    ctx.strokeStyle='#ffffff30';ctx.setLineDash([4,6]);ctx.beginPath();ctx.moveTo(x,r*2+10);ctx.lineTo(x,H);ctx.stroke();ctx.setLineDash([]);
    drawBlob(ctx,x,r+8,r,curLevel,{});
  }else if(!over&&!bombMode){const r=RAD[curLevel];ctx.globalAlpha=.35;drawBlob(ctx,Math.max(r+2,Math.min(W-r-2,aimX)),r+8,r,curLevel,{});ctx.globalAlpha=1}
  for(const b of blobs){
    b.kv+=-.22*b.k-.1*b.kv;b.k+=b.kv;if(Math.abs(b.k)<.001&&Math.abs(b.kv)<.001)b.k=b.kv=0;
    b.sv+=-.18*(b.s-1)-.12*b.sv;b.s+=b.sv;
    const near=Math.hypot(b.velocity.x,b.velocity.y)>2;
    drawBlob(ctx,b.position.x,b.position.y,RAD[b.lvl],b.lvl,{a:b.angle,k:b.k+Math.sin(now/500+b.id)*.008,ka:b.ka,s:b.s,happy:Math.abs(b.k)>.06||near&&b.lvl>3});
    if(bombMode){ctx.strokeStyle='#ff547088';ctx.lineWidth=2;ctx.beginPath();ctx.arc(b.position.x,b.position.y,RAD[b.lvl]+3,0,7);ctx.stroke()}
  }
  for(let i=fx.length-1;i>=0;i--){const p=fx[i];p.x+=p.vx;p.y+=p.vy;p.vy+=.12;p.life-=.025;
    if(p.life<=0){fx.splice(i,1);continue}
    ctx.globalAlpha=p.life;ctx.fillStyle=p.c;ctx.beginPath();ctx.arc(p.x,p.y,p.r*p.life,0,7);ctx.fill();ctx.globalAlpha=1}
}

/* ───────── 버튼 연결 ───────── */
function start(m){hide('ovStart');hide('ovOver');hide('ovMenu');newGame(m)}
$('goNormal').onclick=()=>start('normal');
$('goDaily').onclick=()=>start('daily');
$('goDex').onclick=openDex;$('bDex').onclick=openDex;$('dexClose').onclick=()=>hide('ovDex');
$('goTheme').onclick=openTheme;$('themeClose').onclick=()=>hide('ovTheme');
$('bShake').onclick=()=>useItem('shake');
$('bBomb').onclick=()=>{if(bombMode){bombMode=false;refreshUI()}else useItem('bomb')};
$('bMenu').onclick=()=>{refreshUI();show('ovMenu')};$('mClose').onclick=()=>hide('ovMenu');
$('mSound').onclick=()=>{S.sound=!S.sound;store.set('sound',S.sound);refreshUI()};
$('mMusic').onclick=()=>{S.music=!S.music;store.set('music',S.music);S.music?Music.start(S.theme):Music.stop();refreshUI()};
$('mVib').onclick=()=>{S.vib=!S.vib;store.set('vib',S.vib);refreshUI()};
$('mNoAds').onclick=()=>Monet.buyNoAds();
$('mRestart').onclick=()=>start(mode||'normal');
$('bRetry').onclick=()=>start(mode);
$('bHome').onclick=()=>{hide('ovOver');refreshUI();show('ovStart')};
$('bRevive').onclick=()=>Monet.rewarded(ok=>{if(ok)revive()});
$('bShare').onclick=()=>{
  const t=`🫧 Blob Drop ${mode==='daily'?todayKey()+' 데일리':''} ${score}점 · 최고 단계 ${THEMES[S.theme].levels[maxLevel][0]}\n${location.href.split('?')[0]}`;
  if(navigator.share)navigator.share({text:t}).catch(()=>{});
  else if(navigator.clipboard)navigator.clipboard.writeText(t).then(()=>alert('복사되었습니다!'));
};
function openTheme(){
  const box=$('themeList');box.innerHTML='';
  Object.keys(THEMES).forEach(k=>{
    const b=document.createElement('button');b.style.cssText='display:block;width:100%;margin:6px 0';
    b.textContent=(k===S.theme?'✅ ':'')+THEMES[k].name+' ('+((S.dex[k]||[]).length)+'/'+N+')';
    b.onclick=()=>{S.theme=k;store.set('theme',k);hide('ovTheme');if(Music.on)Music.start(k);refreshUI()};
    box.appendChild(b)});
  show('ovTheme');
}

resize();newGame('normal');refreshUI();requestAnimationFrame(frame);
// 테스트/디버그용 훅
window.__bd={Music,get blobs(){return blobs},get score(){return score},addBlob,drop,get over(){return over}};
})();
</script>
